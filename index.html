<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Engine</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-leg: #ffb100;
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #112211 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        section { display: none; flex-direction: column; align-items: center; padding: 15px; height: calc(100vh - 70px); }
        section.active { display: flex; }

        /* Контейнер сборки артефакта */
        .artifact-canvas {
            width: 250px; height: 250px;
            position: relative;
            margin: 20px 0;
            display: flex; align-items: center; justify-content: center;
        }

        .layer {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .layer-bg { z-index: 1; border-radius: 30px; }
        
        .layer-frame { 
            z-index: 2; 
            animation: pulse-frame 8s infinite ease-in-out;
        }

        .layer-core { 
            z-index: 3; 
            width: 80%; height: 80%;
            animation: float-core 4s infinite ease-in-out;
        }

        @keyframes float-core {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 25px var(--glow-color, #fff)); }
        }

        @keyframes pulse-frame {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        /* Остальной UI */
        .artifact-selector { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 10px 0; margin-bottom: 5px; }
        .thumb { width: 50px; height: 50px; border-radius: 10px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; }
        .thumb.active { opacity: 1; border-color: #fff !important; }

        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .balance-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .bal-val { font-size: 18px; font-weight: 800; }

        .rarity-badge { font-size: 11px; font-weight: 900; padding: 4px 15px; border-radius: 20px; border: 1px solid; margin-bottom: 5px; text-transform: uppercase; }

        .nav-bar { height: 70px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.4; font-size: 10px; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }

        .btn-harvest { background: var(--primary-green); color: #000; border: none; padding: 12px; border-radius: 15px; font-weight: 900; width: 100%; max-width: 280px; margin-top: auto; }
    </style>
</head>
<body>

    <section id="main-screen" class="active">
        <h1>Nature Core</h1>
        <div class="artifact-selector" id="selector"></div>

        <div class="balance-grid" id="main-ui" style="display: none;">
            <div class="balance-card">
                <div class="bal-val" id="live-balance" style="color:var(--primary-green);">0.0000</div>
                <div style="font-size: 8px; opacity: 0.5;">POWER ACCRUAL</div>
            </div>
            <div class="balance-card">
                <div class="bal-val" id="total-balance">0.00</div>
                <div style="font-size: 8px; opacity: 0.5;">TOTAL NCORE</div>
            </div>
        </div>

        <div class="artifact-canvas" id="canvas" style="display: none;">
            <img src="" id="layer-bg" class="layer layer-bg">
            <img src="" id="layer-frame" class="layer layer-frame">
            <img src="" id="layer-core" class="layer layer-core">
        </div>
        <div id="loader" style="margin: 50px; opacity: 0.5;">Loading artifacts...</div>

        <div id="rarity-badge" class="rarity-badge" style="display:none;"></div>

        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        <div id="ton-connect-button" style="margin-top: 10px;"></div>
    </section>

    <section id="tasks-screen">
        <h1>Quests</h1>
        <div style="padding: 40px; text-align: center; opacity: 0.3;">New tasks coming soon...</div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showScene('main-screen', this)"><span>🌿</span><span>Core</span></div>
        <div class="nav-item" onclick="showScene('tasks-screen', this)"><span>📜</span><span>Quests</span></div>
    </nav>

    <script>
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        function showScene(sceneId, navElement) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navElement.classList.add('active');
        }

        // Логика подбора файлов из метаданных
        function getAssetPath(attributes) {
            let info = { 
                rarity: 'common', 
                color: '#4caf50', 
                bg: 'bg_MysticForest.png',
                frameNum: 1,
                coreNum: 1,
                prefix: 'common'
            };

            attributes.forEach(attr => {
                const type = attr.trait_type.toLowerCase();
                const val = attr.value;

                if (type.includes('background')) {
                    // Маппинг фонов
                    if (val.includes('Void')) info.bg = 'bg_Abyssal_Void.png';
                    if (val.includes('Ruins')) info.bg = 'bg_AncientRuins.png';
                    if (val.includes('Forge')) info.bg = 'bg_EtherealForge.png';
                    if (val.includes('Frozen')) info.bg = 'bg_Frozen.png';
                }

                if (type.includes('frame')) {
                    // Вытягиваем число из строки типа "Frame #5"
                    const numMatch = val.match(/\d+/);
                    if (numMatch) info.frameNum = numMatch[0];
                    
                    if (val.toLowerCase().includes('rare')) { info.rarity = 'rare'; info.prefix = 'rare'; info.color = '#0070dd'; }
                    if (val.toLowerCase().includes('epic')) { info.rarity = 'epic'; info.prefix = 'epic'; info.color = '#a335ee'; }
                    if (val.toLowerCase().includes('leg')) { info.rarity = 'legendary'; info.prefix = 'leg'; info.color = '#ffb100'; }
                }

                if (type.includes('core')) {
                    const numMatch = val.match(/\d+/);
                    if (numMatch) info.coreNum = numMatch[0];
                }
            });

            return info;
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const assets = getAssetPath(nft.metadata.attributes || []);
            const nftId = parseInt(nft.metadata.name.split('#')[1]);

            // Сборка путей к файлам
            document.getElementById('layer-bg').src = `Background/${assets.bg}`;
            document.getElementById('layer-frame').src = `frames/frame_${assets.prefix}_${assets.frameNum}.png`;
            document.getElementById('layer-core').src = `cores/Y_${assets.prefix}_${assets.coreNum}.png`;

            document.getElementById('canvas').style.display = 'flex';
            document.getElementById('loader').style.display = 'none';

            // Обновление свечения
            document.documentElement.style.setProperty('--glow-color', assets.color);

            // Бейдж
            const badge = document.getElementById('rarity-badge');
            badge.innerText = `${assets.rarity} #${nftId}`;
            badge.style.color = assets.color;
            badge.style.borderColor = assets.color;
            badge.style.display = 'block';

            // Экономика
            let power = 100;
            if (assets.rarity === 'rare') power = 250;
            if (assets.rarity === 'epic') power = 550;
            if (assets.rarity === 'legendary') power = 1200;
            if (nftId <= 50) power += 100;

            let rate = power * 0.1;
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            if (timer) clearInterval(timer);
            let acc = 0;
            timer = setInterval(() => {
                acc += (rate / 86400) / 10;
                document.getElementById('live-balance').innerText = acc.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                const data = await response.json();
                if (data.nft_items) {
                    allNfts = data.nft_items;
                    document.getElementById('main-ui').style.display = 'grid';
                    document.getElementById('harvest-btn').style.display = 'block';
                    const selector = document.getElementById('selector');
                    selector.innerHTML = '';
                    allNfts.forEach((nft, i) => {
                        const img = document.createElement('img');
                        img.src = nft.metadata.image;
                        img.className = 'thumb';
                        img.onclick = () => selectArtifact(i);
                        selector.appendChild(img);
                    });
                    selectArtifact(0);
                }
            }
        });

        function harvest() {
            let val = parseFloat(document.getElementById('live-balance').innerText);
            if (val > 0) {
                total += val;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }
    </script>
</body>
</html>
