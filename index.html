<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-legendary: #ffb100;
            --glow-green: rgba(76, 175, 80, 0.4);
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #112211 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Управление сценами */
        section {
            display: none; /* Все сцены скрыты по умолчанию */
            flex-direction: column;
            align-items: center;
            padding: 15px;
            height: calc(100vh - 70px);
            overflow-y: auto;
            box-sizing: border-box;
        }

        section.active { display: flex; } /* Видна только активная */

        /* Шапка */
        .header { text-align: center; width: 100%; margin-bottom: 10px; }
        h1 { font-size: 18px; margin: 0; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; }

        /* Экраны контента */
        .artifact-display {
            width: 200px; height: 200px; border-radius: 30px; position: relative;
            margin: 15px 0; display: flex; align-items: center; justify-content: center;
        }
        .artifact-display::before {
            content: ''; position: absolute; width: 140%; height: 140%;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            animation: pulse-glow 4s infinite ease-in-out; z-index: -1;
        }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.5; transform: scale(1.1); } }
        .artifact-image { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; }

        /* Задания */
        .task-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h4 { margin: 0; font-size: 14px; }
        .task-info p { margin: 5px 0 0; font-size: 11px; opacity: 0.6; }
        .btn-task {
            background: var(--primary-green);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Навигация снизу */
        .nav-bar {
            height: 70px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.5;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
        }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* Вспомогательные стили из прошлых версий */
        .artifact-selector { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 10px 0; margin-bottom: 10px; }
        .thumb { width: 50px; height: 50px; border-radius: 10px; opacity: 0.4; flex-shrink: 0; object-fit: cover; }
        .thumb.active { opacity: 1; border: 2px solid #fff; }
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; }
        .balance-card { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .btn-harvest { background: var(--primary-green); color: #000; border: none; padding: 12px; border-radius: 15px; font-weight: 900; width: 100%; max-width: 280px; margin: 15px 0; }
        .traits-container { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
        .trait-tag { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-size: 9px; }
    </style>
</head>
<body>

    <section id="main-screen" class="active">
        <div class="header"><h1>Nature Core</h1></div>
        
        <div class="artifact-selector" id="selector"></div>

        <div class="balance-grid" id="main-ui" style="display: none;">
            <div class="balance-card">
                <div class="bal-val" id="live-balance" style="color:var(--primary-green); font-weight: 800;">0.0000</div>
                <div style="font-size: 8px; opacity: 0.5;">ACCUMULATING</div>
            </div>
            <div class="balance-card">
                <div class="bal-val" id="total-balance" style="font-weight: 800;">0.00</div>
                <div style="font-size: 8px; opacity: 0.5;">TOTAL CORE</div>
            </div>
        </div>

        <div class="artifact-display">
            <img src="" id="nft-img" class="artifact-image" style="display:none;">
            <div id="loader" style="opacity:0.4;">Connect Wallet...</div>
        </div>

        <div id="traits-box" class="traits-container"></div>

        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        
        <div id="ton-connect-button" style="margin-top: auto; padding-bottom: 20px;"></div>
    </section>

    <section id="tasks-screen">
        <div class="header"><h1>Quests</h1></div>
        <p style="font-size: 12px; opacity: 0.6; text-align: center;">Выполняйте задания, чтобы получить бонусы к Power Index</p>
        
        <div class="task-card">
            <div class="task-info">
                <h4>Nature Twitter</h4>
                <p>Подпишись на наш X (+20 Power)</p>
            </div>
            <button class="btn-task" onclick="window.open('https://x.com/')">GO</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h4>Telegram Channel</h4>
                <p>Вступи в сообщество (+10 Power)</p>
            </div>
            <button class="btn-task" onclick="window.open('https://t.me/')">JOIN</button>
        </div>

        <div class="task-card" style="opacity: 0.5;">
            <div class="task-info">
                <h4>Daily Water</h4>
                <p>Скоро: полей дерево 7 дней подряд</p>
            </div>
            <button class="btn-task" disabled>LOCK</button>
        </div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showScene('main-screen', this)">
            <span class="nav-icon">🌿</span>
            <span>Core</span>
        </div>
        <div class="nav-item" onclick="showScene('tasks-screen', this)">
            <span class="nav-icon">📜</span>
            <span>Tasks</span>
        </div>
    </nav>

    <script>
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let accumulating = 0;
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let currentRate = 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        // Функция переключения сцен
        function showScene(sceneId, navElement) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navElement.classList.add('active');
        }

        function harvest() {
            if (accumulating > 0) {
                total += accumulating;
                accumulating = 0;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const name = nft.metadata.name;
            const nftId = parseInt(name.split('#')[1]);
            const attributes = nft.metadata.attributes || [];

            document.getElementById('nft-img').src = nft.metadata.image;
            document.getElementById('nft-img').style.display = 'block';

            const traitsBox = document.getElementById('traits-box');
            traitsBox.innerHTML = '';
            let power = 100;

            attributes.forEach(attr => {
                const tag = document.createElement('div');
                tag.className = 'trait-tag';
                tag.innerText = `${attr.trait_type}: ${attr.value}`;
                traitsBox.appendChild(tag);

                const lowerVal = attr.value.toLowerCase();
                if (lowerVal.includes('rare')) power += 100;
                if (lowerVal.includes('epic')) power += 300;
                if (lowerVal.includes('legendary')) power += 800;
            });

            if (nftId <= 50) power += 50;
            currentRate = power * 0.1;

            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            if (timer) clearInterval(timer);
            const perTick = (currentRate / 86400) / 10;
            timer = setInterval(() => {
                accumulating += perTick;
                document.getElementById('live-balance').innerText = accumulating.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                    const data = await response.json();
                    if (data.nft_items && data.nft_items.length > 0) {
                        allNfts = data.nft_items;
                        document.getElementById('main-ui').style.display = 'grid';
                        document.getElementById('harvest-btn').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';
                        const selector = document.getElementById('selector');
                        selector.innerHTML = '';
                        allNfts.forEach((nft, i) => {
                            const img = document.createElement('img');
                            img.src = nft.metadata.image;
                            img.className = 'thumb';
                            img.onclick = () => selectArtifact(i);
                            selector.appendChild(img);
                        });
                        selectArtifact(0);
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
</body>
</html>
