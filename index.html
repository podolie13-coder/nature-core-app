<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-legendary: #ffb100;
            --glow-green: rgba(76, 175, 80, 0.4);
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #0a1a0a 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 { font-size: 18px; margin: 0; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; }

        /* Селектор артефактов */
        .artifact-selector {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            width: 100%;
            padding: 15px 5px;
            scrollbar-width: none;
        }
        .artifact-selector::-webkit-scrollbar { display: none; }
        .thumb {
            width: 55px; height: 55px; border-radius: 12px; border: 2px solid transparent;
            flex-shrink: 0; cursor: pointer; opacity: 0.4; transition: 0.3s; object-fit: cover;
        }
        .thumb.active { border-color: #fff; opacity: 1; box-shadow: 0 0 15px var(--glow-green); }

        /* Балансы */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-bottom: 15px; }
        .balance-card { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .bal-val { font-size: 18px; font-weight: 800; }
        .highlight { color: var(--primary-green); text-shadow: 0 0 10px var(--glow-green); }
        .bal-label { font-size: 8px; opacity: 0.5; text-transform: uppercase; margin-top: 4px; }

        /* Центр: Артефакт */
        .artifact-display {
            width: 200px; height: 200px; border-radius: 30px; position: relative;
            margin: 10px 0; display: flex; align-items: center; justify-content: center;
        }
        .artifact-display::before {
            content: ''; position: absolute; width: 140%; height: 140%;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            animation: pulse-glow 4s infinite ease-in-out; z-index: -1;
        }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.5; transform: scale(1.1); } }
        .artifact-image { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        /* Характеристики (Traits) */
        .traits-container {
            display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
            width: 100%; max-width: 360px; margin: 15px 0;
        }
        .trait-tag {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px; border-radius: 8px; font-size: 10px; display: flex; flex-direction: column; align-items: center;
        }
        .trait-label { opacity: 0.4; font-size: 7px; text-transform: uppercase; margin-bottom: 2px; }

        /* Бейджи */
        .badge-row { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 10px; }
        .rarity-badge { padding: 4px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid; text-transform: uppercase; }

        .btn-harvest {
            background: var(--primary-green); color: #000; border: none; padding: 15px;
            border-radius: 20px; font-weight: 900; font-size: 14px; text-transform: uppercase;
            width: 100%; max-width: 300px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-harvest:active { transform: scale(0.97); }

        .ui-panel { width: 100%; max-width: 360px; margin-top: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Nature Core</h1>

    <div class="artifact-selector" id="selector"></div>

    <div class="balance-grid" id="main-ui" style="display: none;">
        <div class="balance-card">
            <div class="bal-val highlight" id="live-balance">0.0000</div>
            <div class="bal-label">Accumulating</div>
        </div>
        <div class="balance-card">
            <div class="bal-val" id="total-balance">0.00</div>
            <div class="bal-label">Total Core</div>
        </div>
    </div>

    <div class="artifact-display">
        <img src="" id="nft-img" class="artifact-image" style="display:none;">
        <div id="loader" style="opacity:0.4;">Connect Wallet...</div>
    </div>

    <div class="badge-row" id="badge-row" style="display:none;">
        <div id="rarity-tag" class="rarity-badge">Common</div>
        <div id="legacy-tag" class="rarity-badge" style="color:var(--rarity-legendary); border-color:var(--rarity-legendary); display:none;">Legacy founding 50</div>
    </div>

    <div class="traits-container" id="traits-box"></div>

    <div class="ui-panel">
        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        <div id="ton-connect-button" style="margin-top:15px;"></div>
    </div>

    <script>
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let accumulating = 0;
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let currentRate = 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        function harvest() {
            if (accumulating > 0) {
                total += accumulating;
                accumulating = 0;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const name = nft.metadata.name;
            const nftId = parseInt(name.split('#')[1]);
            const attributes = nft.metadata.attributes || [];

            // 1. Визуал
            document.getElementById('nft-img').src = nft.metadata.image;
            document.getElementById('badge-row').style.display = 'flex';
            document.getElementById('legacy-tag').style.display = (nftId <= 50) ? 'block' : 'none';

            // 2. Расчет редкости и статов
            let power = 100;
            let rarityColor = 'var(--rarity-common)';
            let rarityName = 'Common';

            // Очистка и заполнение характеристик
            const traitsBox = document.getElementById('traits-box');
            traitsBox.innerHTML = '';

            attributes.forEach(attr => {
                const val = attr.value;
                const traitType = attr.trait_type;
                
                // Создаем тег для каждого атрибута
                const tag = document.createElement('div');
                tag.className = 'trait-tag';
                tag.innerHTML = `<span class="trait-label">${traitType}</span><span>${val}</span>`;
                traitsBox.appendChild(tag);

                // Логика редкости
                const lowerVal = val.toLowerCase();
                if (lowerVal.includes('rare')) { power += 100; rarityName = 'Rare'; rarityColor = 'var(--rarity-rare)'; }
                if (lowerVal.includes('epic')) { power += 300; rarityName = 'Epic'; rarityColor = 'var(--rarity-epic)'; }
                if (lowerVal.includes('legendary')) { power += 800; rarityName = 'Legendary'; rarityColor = 'var(--rarity-legendary)'; }
            });

            if (nftId <= 50) power += 50;

            const rTag = document.getElementById('rarity-tag');
            rTag.innerText = `${rarityName} #${nftId}`;
            rTag.style.color = rarityColor;
            rTag.style.borderColor = rarityColor;

            currentRate = power * 0.1;
            
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            if (timer) clearInterval(timer);
            const perTick = (currentRate / 86400) / 10;
            timer = setInterval(() => {
                accumulating += perTick;
                document.getElementById('live-balance').innerText = accumulating.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                    const data = await response.json();

                    if (data.nft_items && data.nft_items.length > 0) {
                        allNfts = data.nft_items;
                        document.getElementById('main-ui').style.display = 'grid';
                        document.getElementById('harvest-btn').style.display = 'block';
                        document.getElementById('nft-img').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';

                        const selector = document.getElementById('selector');
                        selector.innerHTML = '';
                        allNfts.forEach((nft, i) => {
                            const img = document.createElement('img');
                            img.src = nft.metadata.image;
                            img.className = 'thumb';
                            img.onclick = () => selectArtifact(i);
                            selector.appendChild(img);
                        });
                        selectArtifact(0);
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
</body>
</html>
