<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Engine</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-leg: #ffb100;
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #112211 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        section { display: none; flex-direction: column; align-items: center; padding: 15px; height: calc(100vh - 70px); }
        section.active { display: flex; }

        h1 { font-size: 20px; margin: 0 0 10px 0; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; }

        /* Контейнер сборки артефакта */
        .artifact-canvas {
            width: 260px; height: 260px;
            position: relative;
            margin: 10px 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .layer {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .layer-bg { z-index: 1; }
        
        .layer-frame { 
            z-index: 2; 
            animation: pulse-frame 8s infinite ease-in-out;
        }

        .layer-core { 
            z-index: 3; 
            width: 85%; height: 85%;
            animation: float-core 4s infinite ease-in-out;
        }

        @keyframes float-core {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 15px var(--glow-color, #fff)); }
            50% { transform: translateY(-12px) scale(1.05); filter: drop-shadow(0 0 30px var(--glow-color, #fff)); }
        }

        @keyframes pulse-frame {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        .artifact-selector { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 5px; margin-bottom: 5px; scrollbar-width: none; }
        .artifact-selector::-webkit-scrollbar { display: none; }
        .thumb { width: 50px; height: 50px; border-radius: 10px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; object-fit: cover; }
        .thumb.active { opacity: 1; border-color: #fff !important; }

        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .balance-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .bal-val { font-size: 18px; font-weight: 800; }

        .rarity-badge { font-size: 11px; font-weight: 900; padding: 4px 15px; border-radius: 20px; border: 1px solid; margin-bottom: 10px; text-transform: uppercase; }

        .btn-harvest { 
            background: var(--primary-green); color: #000; border: none; padding: 12px; 
            border-radius: 15px; font-weight: 900; width: 100%; max-width: 280px; 
            margin-top: auto; box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }

        .nav-bar { height: 70px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.4; font-size: 10px; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
    </style>
</head>
<body>

    <section id="main-screen" class="active">
        <h1>Nature Core</h1>
        <div class="artifact-selector" id="selector"></div>

        <div class="balance-grid" id="main-ui" style="display: none;">
            <div class="balance-card">
                <div class="bal-val" id="live-balance" style="color:var(--primary-green);">0.0000</div>
                <div style="font-size: 8px; opacity: 0.5;">POWER ACCRUAL</div>
            </div>
            <div class="balance-card">
                <div class="bal-val" id="total-balance">0.00</div>
                <div style="font-size: 8px; opacity: 0.5;">TOTAL NCORE</div>
            </div>
        </div>

        <div class="artifact-canvas" id="canvas" style="display: none;">
            <img src="" id="layer-bg" class="layer layer-bg">
            <img src="" id="layer-frame" class="layer layer-frame">
            <img src="" id="layer-core" class="layer layer-core">
        </div>
        
        <div id="loader" style="margin: 40px; opacity: 0.5;">Scanning artifacts...</div>

        <div id="rarity-badge" class="rarity-badge" style="display:none;"></div>

        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        <div id="ton-connect-button" style="margin-top: 10px;"></div>
    </section>

    <section id="tasks-screen">
        <h1>Quests</h1>
        <div style="padding: 40px; text-align: center; opacity: 0.3;">New tasks coming soon...</div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showScene('main-screen', this)"><span>🌿</span><span>Core</span></div>
        <div class="nav-item" onclick="showScene('tasks-screen', this)"><span>📜</span><span>Quests</span></div>
    </nav>

    <script>
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        function showScene(sceneId, navElement) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navElement.classList.add('active');
        }

        function parseMetadata(attributes) {
            let res = { rarity: 'common', prefix: 'common', frame: 1, core: 1, bg: 'bg_MysticForest.png', color: '#4caf50' };

            attributes.forEach(a => {
                const t = a.trait_type.toLowerCase();
                const v = a.value;

                if (t.includes('background')) {
                    if (v.includes('Void')) res.bg = 'bg_Abyssal_Void.png';
                    else if (v.includes('Ruins')) res.bg = 'bg_AncientRuins.png';
                    else if (v.includes('Forge')) res.bg = 'bg_EtherealForge.png';
                    else if (v.includes('Frozen')) res.bg = 'bg_Frozen.png';
                }

                if (t.includes('frame')) {
                    const n = v.match(/\d+/);
                    if (n) res.frame = n[0];
                    if (v.toLowerCase().includes('rare')) { res.rarity = 'rare'; res.prefix = 'rare'; res.color = '#0070dd'; }
                    else if (v.toLowerCase().includes('epic')) { res.rarity = 'epic'; res.prefix = 'epic'; res.color = '#a335ee'; }
                    else if (v.toLowerCase().includes('leg')) { res.rarity = 'legendary'; res.prefix = 'leg'; res.color = '#ffb100'; }
                }

                if (t.includes('core')) {
                    const n = v.match(/\d+/);
                    if (n) res.core = n[0];
                }
            });
            return res;
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const data = parseMetadata(nft.metadata.attributes || []);
            const id = parseInt(nft.metadata.name.split('#')[1]);

            // ПУТИ К ТВОИМ ПАПКАМ (с проверкой регистра)
            document.getElementById('layer-bg').src = `Background/${data.bg}`;
            document.getElementById('layer-frame').src = `frames/frame_${data.prefix}_${data.frame}.png`;
            document.getElementById('layer-core').src = `cores/Y_${data.prefix}_${data.core}.png`;

            document.getElementById('canvas').style.display = 'flex';
            document.getElementById('loader').style.display = 'none';
            document.documentElement.style.setProperty('--glow-color', data.color);

            const badge = document.getElementById('rarity-badge');
            badge.innerText = `${data.rarity} #${id}`;
            badge.style.color = data.color;
            badge.style.borderColor = data.color;
            badge.style.display = 'block';

            let power = 100;
            if (data.rarity === 'rare') power = 250;
            if (data.rarity === 'epic') power = 550;
            if (data.rarity === 'legendary') power = 1200;
            if (id <= 50) power += 150;

            let rate = power * 0.1;
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            if (timer) clearInterval(timer);
            let acc = 0;
            timer = setInterval(() => {
                acc += (rate / 86400) / 10;
                document.getElementById('live-balance').innerText = acc.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                const resData = await response.json();
                if (resData.nft_items) {
                    allNfts = resData.nft_items;
                    document.getElementById('main-ui').style.display = 'grid';
                    document.getElementById('harvest-btn').style.display = 'block';
                    const selector = document.getElementById('selector');
                    selector.innerHTML = '';
                    allNfts.forEach((nft, i) => {
                        const img = document.createElement('img');
                        img.src = nft.metadata.image;
                        img.className = 'thumb';
                        img.onclick = () => selectArtifact(i);
                        selector.appendChild(img);
                    });
                    selectArtifact(0);
                }
            }
        });

        function harvest() {
            let val = parseFloat(document.getElementById('live-balance').innerText);
            if (val > 0) {
                total += val;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }
    </script>
</body>
</html>
