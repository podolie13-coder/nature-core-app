<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Engine v3.9</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-leg: #ffb100;
            --dark-bg: #050a05;
            --glow-color: #4caf50;
            --gold-gradient: linear-gradient(90deg, #ffd700, #fff5b1, #ffb100, #ffd700);
        }

        body {
            background: var(--dark-bg);
            color: #e0f2e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Улучшенный живой фон с эффектом виньетки */
        #app-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; 
            background-size: cover;
            background-position: center;
            filter: brightness(0.4);
            transition: background-image 1s ease-in-out;
            transform: scale(1.05);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, transparent 20%, var(--dark-bg) 100%);
        }

        section { 
            display: none; flex-direction: column; align-items: center; 
            padding: 15px; height: calc(100vh - 75px); box-sizing: border-box; 
            overflow-y: auto; width: 100%; z-index: 1;
        }
        section.active { display: flex !important; }

        #artifact-name { font-size: 18px; font-weight: 900; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }

        #origin-badge { 
            font-size: 10px; font-weight: 900; color: #000;
            background: var(--gold-gradient); background-size: 300% 100%;
            padding: 4px 15px; border-radius: 20px; margin-bottom: 15px; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: gold-flow 3s linear infinite; display: none;
        }

        @keyframes gold-flow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* Окно артефакта */
        .artifact-canvas {
            width: 180px; height: 180px; position: relative; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 35px; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); background: rgba(0,0,0,0.7);
        }

        .layer { position: absolute; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .layer-core { width: 82%; height: 82%; animation: core-float 3s infinite ease-in-out; }
        @keyframes core-float { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); } 50% { transform: translateY(-8px); filter: drop-shadow(0 0 25px var(--glow-color)); } }

        /* Коллекция - ПОЛЗУНОК СКРЫТ */
        .artifact-selector { 
            display: flex; gap: 12px; overflow-x: auto; width: 100%; 
            padding: 10px 0; min-height: 75px; scroll-behavior: smooth;
            scrollbar-width: none; /* Скрываем в Firefox */
        }
        .artifact-selector::-webkit-scrollbar { display: none; /* Скрываем в Chrome/Safari */ }

        .thumb { width: 55px; height: 55px; border-radius: 12px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .thumb.active { opacity: 1; border-color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        /* Стеклянные атрибуты */
        .attr-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 340px; margin: 10px 0; }
        .attr-item {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px;
            border-radius: 15px; text-align: center; min-width: 90px;
        }
        .attr-label { font-size: 8px; opacity: 0.5; text-transform: uppercase; margin-bottom: 3px; color: #fff; letter-spacing: 1px; }
        .attr-value { font-size: 11px; font-weight: 800; }

        /* Нижняя навигация - ВОССТАНОВЛЕНА */
        .nav-bar { 
            height: 75px; background: rgba(5, 10, 5, 0.95); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            display: flex; justify-content: space-around; align-items: center; 
            position: fixed; bottom: 0; width: 100%; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
        .nav-item span:first-child { font-size: 20px; margin-bottom: 4px; }

        /* Кнопка сбора */
        .btn-harvest {
            background: var(--primary-green); color: #000; border: none; padding: 12px 30px;
            border-radius: 15px; font-weight: 900; font-size: 15px; cursor: pointer;
            margin: 10px 0; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            transition: 0.2s;
        }
        .btn-harvest:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="app-bg"></div>
    <div class="bg-overlay"></div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <section id="screen-core" class="active">
        <div id="artifact-name">Nature Artifact</div>
        <div id="origin-badge">👑 Genesis Edition 👑</div>
        
        <div class="artifact-selector" id="nft-list">
            <!-- Сюда подгрузятся NFT -->
        </div>
        
        <div id="canvas-container" class="artifact-canvas" style="display: none;">
            <img src="" id="img-bg" class="layer">
            <img src="" id="img-frame" class="layer" style="z-index: 2;">
            <img src="" id="img-core" class="layer layer-core" style="z-index: 3;">
        </div>

        <div class="attr-container" id="nft-attrs"></div>
        
        <button class="btn-harvest" id="harvest-btn" style="display: none;" onclick="harvestEnergy()">Собрать энергию</button>
        <div id="ton-connect-btn"></div>
    </section>

    <!-- ЭКРАН ТОКЕНА -->
    <section id="screen-token">
        <h1>Nature Token</h1>
        <div style="font-size: 60px; margin: 40px 0;">🪙</div>
        <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; text-align: center; border: 1px dashed var(--primary-green);">
            <h2 style="color: var(--primary-green);">$NCORE</h2>
            <p>Добытая энергия будет конвертирована в токены после листинга.</p>
        </div>
    </section>

    <!-- ЭКРАН КВЕСТОВ -->
    <section id="screen-quests">
        <h1>Задания</h1>
        <p style="opacity: 0.5; margin-top: 50px;">Новые испытания появятся скоро...</p>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchTab('screen-core', this)"><span>🌿</span><span>Артефакт</span></div>
        <div class="nav-item" onclick="switchTab('screen-token', this)"><span>🪙</span><span>Токен</span></div>
        <div class="nav-item" onclick="switchTab('screen-quests', this)"><span>📜</span><span>Задания</span></div>
    </nav>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let userNfts = [];
        let totalBalance = parseFloat(localStorage.getItem('ncore_total')) || 0;
        let sessionAccrual = 0;
        let miningTimer = null;

        const CORE_NAMES = {
            "Common 1": "Wood Core", "Common 2": "Stone Core", "Common 3": "Metal Core",
            "Rare 1": "Frost Core", "Rare 2": "Storm Core", "Rare 3": "Ember Core", "Rare 4": "Terra Core",
            "Epic 1": "Void Core", "Epic 2": "Plasma Core", "Epic 3": "Solar Core",
            "Legendary 1": "Nature Core", "Legendary 2": "Ancient Core", "Legendary 3": "Eternal Core"
        };

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        function switchTab(screenId, el) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function getRarityColor(text) {
            const t = text.toLowerCase();
            if (t.includes('rare')) return 'var(--rarity-rare)';
            if (t.includes('epic')) return 'var(--rarity-epic)';
            if (t.includes('leg')) return 'var(--rarity-leg)';
            return 'var(--rarity-common)';
        }

        function formatVal(val) {
            if (!val) return "";
            if (val.startsWith('bg_')) return val.replace('bg_', '').replace(/_/g, ' ');
            if (val.startsWith('Y_')) {
                const p = val.split('_');
                const r = p[1].charAt(0).toUpperCase() + p[1].slice(1);
                return CORE_NAMES[`${r} ${p[2]}`] || `${r} ${p[2]} Type`;
            }
            if (val.startsWith('frame_')) {
                const p = val.split('_');
                const r = p[1].charAt(0).toUpperCase() + p[1].slice(1);
                return `${r} ${p[2]} Frame`;
            }
            return val;
        }

        async function buildArtifact(index) {
            const nft = userNfts[index];
            const idMatch = nft.metadata.name.match(/#(\d+)/);
            const id = idMatch ? parseInt(idMatch[1]) : (index + 1);
            
            try {
                const response = await fetch(`${PATH_ASSETS}metadata/${id}.json`);
                const meta = await response.json();
                document.getElementById('artifact-name').innerText = meta.name || `Artifact #${id}`;
                
                const badge = document.getElementById('origin-badge');
                badge.style.display = (id <= 50) ? 'block' : 'none';
                if(id <= 50) badge.innerText = `👑 Genesis Edition ${id}/50 👑`;

                const attrBox = document.getElementById('nft-attrs');
                attrBox.innerHTML = '';
                let bgF = "", frameF = "", coreF = "";

                meta.attributes.forEach(attr => {
                    const type = attr.trait_type;
                    const val = attr.value;
                    const niceVal = formatVal(val);
                    const color = getRarityColor(val);

                    const div = document.createElement('div');
                    div.className = 'attr-item';
                    div.style.borderColor = color;
                    div.innerHTML = `<div class="attr-label">${type}</div><div class="attr-value" style="color:${color}">${niceVal}</div>`;
                    attrBox.appendChild(div);

                    if (type.toLowerCase() === 'background') bgF = val + ".png";
                    if (type.toLowerCase() === 'frame') frameF = val + ".png";
                    if (type.toLowerCase() === 'core') coreF = val + ".png";
                });

                document.getElementById('img-bg').src = `${PATH_ASSETS}backgrounds/${bgF}`;
                document.getElementById('img-frame').src = `${PATH_ASSETS}frames/${frameF}`;
                document.getElementById('img-core').src = `${PATH_ASSETS}cores/${coreF}`;
                document.getElementById('app-bg').style.backgroundImage = `url('${PATH_ASSETS}backgrounds/${bgF}')`;

                let rColor = getRarityColor(frameF);
                document.documentElement.style.setProperty('--glow-color', rColor);
                document.getElementById('canvas-container').style.display = 'flex';
                document.getElementById('harvest-btn').style.display = 'block';

                startMining(frameF, id);
                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
            } catch (err) { console.error(err); }
        }

        function startMining(f, id) {
            if (miningTimer) clearInterval(miningTimer);
            let p = 100;
            if (f.toLowerCase().includes('rare')) p = 250;
            if (id <= 50) p += 150;
            miningTimer = setInterval(() => { sessionAccrual += p * 0.00001; }, 1000);
        }

        function harvestEnergy() {
            totalBalance += sessionAccrual;
            sessionAccrual = 0;
            localStorage.setItem('ncore_total', totalBalance);
            alert("Энергия собрана!");
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                const data = await response.json();
                if (data.nft_items) {
                    userNfts = data.nft_items;
                    const list = document.getElementById('nft-list');
                    list.innerHTML = '';
                    userNfts.forEach((nft, i) => {
                        const img = document.createElement('img');
                        img.src = nft.metadata.image;
                        img.className = 'thumb';
                        img.onclick = () => buildArtifact(i);
                        list.appendChild(img);
                    });
                    buildArtifact(0);
                }
            }
        });
    </script>
</body>
</html>
