<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --glow-green: rgba(76, 175, 80, 0.6);
            --legacy-gold: #ffd700;
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #0a1a0a 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 10px; }
        h1 { font-size: 22px; margin: 0; color: var(--primary-green); text-shadow: 0 0 20px var(--glow-green); text-transform: uppercase; letter-spacing: 2px; }
        
        /* Сетка балансов */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 340px;
            margin: 15px 0;
        }

        .balance-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bal-val { font-size: 18px; font-weight: 800; color: #fff; }
        .bal-label { font-size: 9px; opacity: 0.5; text-transform: uppercase; margin-top: 4px; }
        .highlight { color: var(--primary-green); text-shadow: 0 0 10px var(--glow-green); }

        .artifact-display {
            width: 220px;
            height: 220px;
            border-radius: 30px;
            position: relative;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artifact-display::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            animation: pulse-glow 4s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes pulse-glow { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.5; transform: scale(1.1); } }

        .artifact-image { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; }

        .btn-harvest {
            background: var(--primary-green);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            margin: 20px 0;
            box-shadow: 0 0 20px var(--glow-green);
            display: none;
        }

        .btn-harvest:active { transform: scale(0.98); }

        .rarity-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            border: 1px solid var(--primary-green);
            margin-top: 8px;
            display: none;
        }

        .legacy-status { color: var(--legacy-gold); border-color: var(--legacy-gold); }

        .ui-panel { width: 100%; max-width: 340px; margin-top: auto; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nature Core</h1>
        <center>
            <div id="badge" class="rarity-badge">Common</div>
            <div id="legacy-badge" class="rarity-badge legacy-status">FOUNDING 50 LEGACY</div>
        </center>
    </div>

    <div class="balance-grid" id="main-ui" style="display: none;">
        <div class="balance-card">
            <div class="bal-val highlight" id="live-balance">0.0000</div>
            <div class="bal-label">Accumulating</div>
        </div>
        <div class="balance-card">
            <div class="bal-val" id="total-balance">0.00</div>
            <div class="bal-label">Total Core</div>
        </div>
    </div>

    <div class="artifact-display">
        <img src="" alt="Artifact" class="artifact-image" id="nft-img">
        <div id="loader" style="opacity: 0.5;">Сканирование...</div>
    </div>

    <div class="ui-panel">
        <button class="btn-harvest" id="harvest-btn" onclick="harvest()">Harvest Energy</button>
        <div id="ton-connect-button"></div>
    </div>

    <script>
        const COLLECTION_ADDRESS = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let accumulating = 0;
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let rate = 0;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // Инициализация общего баланса
        document.getElementById('total-balance').innerText = total.toFixed(2);

        function harvest() {
            if (accumulating > 0) {
                total += accumulating;
                accumulating = 0;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
                
                // Легкая вибрация телефона при наличии поддержки
                if (window.navigator.vibrate) window.navigator.vibrate(50);
            }
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION_ADDRESS}`);
                    const data = await response.json();

                    if (data.nft_items && data.nft_items.length > 0) {
                        const nft = data.nft_items[0];
                        const name = nft.metadata.name;
                        const nftId = parseInt(name.split('#')[1]);
                        
                        document.getElementById('nft-img').src = nft.metadata.image;
                        document.getElementById('nft-img').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('main-ui').style.display = 'grid';
                        document.getElementById('harvest-btn').style.display = 'block';
                        document.getElementById('badge').style.display = 'inline-block';
                        document.getElementById('badge').innerText = name;

                        let power = 100;
                        if (nftId <= 50) {
                            document.getElementById('legacy-badge').style.display = 'inline-block';
                            power = 150;
                        }
                        
                        rate = power * 0.1;
                        const perTick = (rate / 86400) / 10; 

                        setInterval(() => {
                            accumulating += perTick;
                            document.getElementById('live-balance').innerText = accumulating.toFixed(4);
                        }, 100);
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
</body>
</html>
