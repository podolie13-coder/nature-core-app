<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background: #0a0f0a; /* Темный лесной фон */
            color: #e0f2e0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #ton-connect-button {
            margin-top: 20px;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #4caf50;
        }
    </style>
</head>
<body>

    <h1>Nature Core</h1>
    <p>Подключите кошелек для доступа к Артефактам</p>

    <div id="ton-connect-button"></div>

    <script>
    // Используем правильное имя объекта библиотеки
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    // Слушатель статуса кошелька (для отладки)
    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            console.log('Кошелек подключен:', wallet);
            document.querySelector('p').innerText = 'Кошелек успешно подключен!';
        }
    });
</script>
    
    </script>
</body>
</html>
