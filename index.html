<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --glow-green: rgba(76, 175, 80, 0.6);
            --legacy-gold: #ffd700;
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #0a1a0a 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; color: var(--primary-green); text-shadow: 0 0 20px var(--glow-green); text-transform: uppercase; letter-spacing: 3px; }
        
        .badge-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .rarity-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid var(--primary-green);
            display: none;
            backdrop-filter: blur(5px);
        }

        .legacy-status {
            color: var(--legacy-gold);
            border-color: var(--legacy-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Контейнер артефакта с анимацией свечения */
        .artifact-display {
            width: 260px;
            height: 260px;
            border-radius: 30px;
            position: relative;
            margin: 10px 0 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artifact-display::before {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            animation: pulse-glow 4s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .artifact-image { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 30px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card.active {
            border-color: var(--primary-green);
            box-shadow: inset 0 0 15px rgba(76, 175, 80, 0.1);
        }

        .stat-value { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-label { font-size: 9px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }

        .ui-panel { width: 100%; max-width: 340px; margin-top: auto; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nature Core</h1>
        <div class="badge-container">
            <div id="badge" class="rarity-badge">Common</div>
            <div id="legacy-badge" class="rarity-badge legacy-status">FOUNDING 50 LEGACY</div>
        </div>
    </div>

    <div class="artifact-display">
        <img src="" alt="Artifact" class="artifact-image" id="nft-img">
        <div id="loader" style="opacity: 0.5;">Сканирование...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card" id="card-p">
            <div class="stat-value" id="power-val">0</div>
            <div class="stat-label">Power Index</div>
        </div>
        <div class="stat-card" id="card-r">
            <div class="stat-value" id="rate-val">0.0</div>
            <div class="stat-label">$NCORE / DAY</div>
        </div>
    </div>

    <div class="ui-panel">
        <div id="ton-connect-button"></div>
    </div>

    <script>
        const COLLECTION_ADDRESS = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // Анимация набора цифр
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = (progress * (end - start) + start);
                obj.innerHTML = id === 'rate-val' ? current.toFixed(1) : Math.floor(current);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION_ADDRESS}`);
                    const data = await response.json();

                    if (data.nft_items && data.nft_items.length > 0) {
                        const nft = data.nft_items[0];
                        const name = nft.metadata.name;
                        const nftId = parseInt(name.split('#')[1]);
                        
                        document.getElementById('nft-img').src = nft.metadata.image;
                        document.getElementById('nft-img').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('badge').style.display = 'block';
                        document.getElementById('badge').innerText = name;

                        let power = 100;
                        if (nftId <= 50) {
                            document.getElementById('legacy-badge').style.display = 'block';
                            power = 150;
                        }

                        if (name.includes('Rare')) power += 50;
                        if (name.includes('Epic')) power += 150;
                        if (name.includes('Legendary')) power += 400;

                        // Запуск анимаций
                        animateValue("power-val", 0, power, 1500);
                        animateValue("rate-val", 0, power * 0.1, 1500);
                        document.getElementById('card-p').classList.add('active');
                        document.getElementById('card-r').classList.add('active');
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
</body>
</html>
