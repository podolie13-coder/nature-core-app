<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Engine v2.9</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --dark-bg: #050a05;
            --glow-color: #4caf50;
            --gold-gradient: linear-gradient(90deg, #ffd700, #fff5b1, #ffb100, #ffd700);
        }

        body {
            background: var(--dark-bg);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            position: relative;
        }

        #app-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(0.3);
            transition: background-image 1s ease-in-out;
            transform: scale(1.1);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, transparent 0%, var(--dark-bg) 100%);
        }

        section { display: none; flex-direction: column; align-items: center; padding: 10px; height: calc(100vh - 70px); box-sizing: border-box; z-index: 1; }
        section.active { display: flex; }

        /* --- НОВЫЕ СТИЛИ ЭЛИТНОЙ ПЛАШКИ GENESIS --- */
        #artifact-name { font-size: 16px; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        #origin-badge { 
            font-size: 10px; 
            font-weight: 900; 
            color: #000;
            background: var(--gold-gradient);
            background-size: 300% 100%;
            padding: 4px 12px; 
            border-radius: 20px; 
            margin-bottom: 12px; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: gold-flow 3s linear infinite, genesis-pulse 2s infinite alternate;
            display: none;
            text-transform: uppercase;
        }

        @keyframes gold-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes genesis-pulse {
            from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
            to { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        }
        /* ------------------------------------------ */

        .artifact-canvas {
            width: 180px; height: 180px;
            position: relative;
            margin: 5px 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.6);
        }

        .layer { position: absolute; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .layer-bg { z-index: 1; }
        .layer-frame { z-index: 2; animation: frame-pulse 5s infinite; }
        .layer-core { z-index: 3; width: 82%; height: 82%; animation: core-float 3s infinite ease-in-out; }

        @keyframes core-float {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); }
            50% { transform: translateY(-7px); filter: drop-shadow(0 0 25px var(--glow-color)); }
        }

        @keyframes frame-pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }

        .artifact-selector { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 5px 0; scrollbar-width: none; }
        .thumb { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; transition: 0.3s; }
        .thumb.active { opacity: 1; border-color: white; transform: scale(1.1); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px; }
        .stat-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); padding: 10px; border-radius: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-val { font-size: 17px; font-weight: bold; color: var(--primary-green); }

        .btn-main {
            background: var(--primary-green); color: black; border: none; padding: 12px 35px;
            border-radius: 15px; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: auto; margin-bottom: 15px;
        }

        .nav-bar { height: 65px; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.6; font-size: 10px; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
    </style>
</head>
<body>

    <div id="app-bg"></div>
    <div class="bg-overlay"></div>

    <section id="screen-core" class="active">
        <div id="artifact-name">Nature Artifact</div>
        <!-- ТЕПЕРЬ ЭТО ЭЛИТНАЯ ПЛАШКА -->
        <div id="origin-badge">👑 Genesis Edition 👑</div>

        <div class="artifact-selector" id="nft-list"></div>

        <div class="stats-grid" id="ui-stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-val" id="accrual-val">0.0000</div>
                <div style="font-size: 8px; opacity: 0.6; text-transform: uppercase;">Mining Power</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="total-val">0.00</div>
                <div style="font-size: 8px; opacity: 0.6; text-transform: uppercase;">Core Assets</div>
            </div>
        </div>

        <div class="artifact-canvas" id="canvas-container" style="display: none;">
            <img src="" id="img-bg" class="layer layer-bg">
            <img src="" id="img-frame" class="layer layer-frame">
            <img src="" id="img-core" class="layer layer-core">
        </div>

        <div id="status-msg" style="margin: 15px; font-size: 13px; opacity: 0.6;">Connect Wallet</div>
        <button class="btn-main" id="harvest-btn" style="display: none;" onclick="harvestEnergy()">Harvest Energy</button>
        <div id="ton-connect-btn"></div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="location.reload()"><span>🌿</span><span>Core</span></div>
        <div class="nav-item"><span>📜</span><span>Quests</span></div>
    </nav>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        
        let userNfts = [];
        let totalBalance = parseFloat(localStorage.getItem('ncore_total')) || 0;
        let sessionAccrual = 0;
        let miningTimer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        document.getElementById('total-val').innerText = totalBalance.toFixed(2);

        async function buildArtifact(index) {
            const nft = userNfts[index];
            const idMatch = nft.metadata.name.match(/#(\d+)/);
            const id = idMatch ? parseInt(idMatch[1]) : (index + 1);
            
            try {
                const response = await fetch(`${PATH_ASSETS}metadata/${id}.json`);
                const meta = await response.json();

                // Имя артефакта
                document.getElementById('artifact-name').innerText = meta.name || `Artifact #${id}`;
                
                // Эффектная плашка GENESIS для первых 50
                const originBadge = document.getElementById('origin-badge');
                if (id <= 50) {
                    originBadge.innerText = `👑 Genesis Edition ${id}/50 👑`;
                    originBadge.style.display = 'block';
                } else {
                    originBadge.style.display = 'none';
                }

                let bgFile = "", frameFile = "", coreFile = "";
                meta.attributes.forEach(attr => {
                    const type = attr.trait_type.toLowerCase();
                    const val = attr.value; 
                    if (type === 'background') bgFile = val + ".png";
                    if (type === 'frame') frameFile = val + ".png";
                    if (type === 'core') coreFile = val + ".png";
                });

                const fullBgPath = `${PATH_ASSETS}backgrounds/${bgFile}`;
                document.getElementById('img-bg').src = fullBgPath;
                document.getElementById('img-frame').src = `${PATH_ASSETS}frames/${frameFile}`;
                document.getElementById('img-core').src = `${PATH_ASSETS}cores/${coreFile}`;
                document.getElementById('app-bg').style.backgroundImage = `url('${fullBgPath}')`;

                let rarityColor = "#4caf50";
                const lowFrame = frameFile.toLowerCase();
                if (lowFrame.includes('rare')) rarityColor = "#0070dd";
                else if (lowFrame.includes('epic')) rarityColor = "#a335ee";
                else if (lowFrame.includes('leg')) rarityColor = "#ffb100";

                document.documentElement.style.setProperty('--glow-color', rarityColor);
                document.getElementById('canvas-container').style.display = 'flex';
                document.getElementById('status-msg').style.display = 'none';
                document.getElementById('harvest-btn').style.display = 'block';

                startMining(frameFile, id);
                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            } catch (err) {
                console.error(err);
            }
        }

        function startMining(frameFile, id) {
            if (miningTimer) clearInterval(miningTimer);
            let power = 100;
            if (frameFile.toLowerCase().includes('rare')) power = 250;
            if (parseInt(id) <= 50) power += 150;
            const rate = power * 0.00001;
            miningTimer = setInterval(() => {
                sessionAccrual += rate;
                document.getElementById('accrual-val').innerText = sessionAccrual.toFixed(4);
            }, 1000);
        }

        function harvestEnergy() {
            totalBalance += sessionAccrual;
            sessionAccrual = 0;
            localStorage.setItem('ncore_total', totalBalance);
            document.getElementById('total-val').innerText = totalBalance.toFixed(2);
            document.getElementById('accrual-val').innerText = "0.0000";
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                const data = await response.json();
                if (data.nft_items) {
                    userNfts = data.nft_items;
                    document.getElementById('ui-stats').style.display = 'grid';
                    const list = document.getElementById('nft-list');
                    list.innerHTML = '';
                    userNfts.forEach((nft, i) => {
                        const img = document.createElement('img');
                        img.src = nft.metadata.image;
                        img.className = 'thumb';
                        img.onclick = () => buildArtifact(i);
                        list.appendChild(img);
                    });
                    buildArtifact(0);
                }
            }
        });
    </script>
</body>
</html>
