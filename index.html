<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --glow-green: rgba(76, 175, 80, 0.6);
            --legacy-gold: #ffd700;
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #0a1a0a 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 { font-size: 20px; margin: 0; color: var(--primary-green); text-shadow: 0 0 15px var(--glow-green); text-transform: uppercase; }
        
        /* Скролл артефактов */
        .artifact-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 0;
            margin: 10px 0;
            scrollbar-width: none; /* Hide scrollbar for Firefox */
        }
        .artifact-selector::-webkit-scrollbar { display: none; } /* Hide for Chrome/Safari */

        .thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px solid transparent;
            flex-shrink: 0;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
            object-fit: cover;
        }
        .thumb.active { border-color: var(--primary-green); opacity: 1; box-shadow: 0 0 10px var(--glow-green); }

        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .balance-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .bal-val { font-size: 16px; font-weight: 800; }
        .highlight { color: var(--primary-green); }

        .artifact-display {
            width: 200px;
            height: 200px;
            border-radius: 25px;
            position: relative;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .artifact-display::before {
            content: '';
            position: absolute;
            width: 130%; height: 130%;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            animation: pulse-glow 4s infinite ease-in-out;
            z-index: -1;
        }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.5; transform: scale(1.1); } }
        .artifact-image { width: 100%; height: 100%; object-fit: cover; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }

        .rarity-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid var(--primary-green);
            margin-bottom: 10px;
        }
        .legacy-badge { color: var(--legacy-gold); border-color: var(--legacy-gold); display: none; margin-top: 5px; }

        .btn-harvest {
            background: var(--primary-green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            width: 100%;
            max-width: 280px;
            margin-bottom: 15px;
        }

        .ui-panel { width: 100%; max-width: 340px; margin-top: auto; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <h1>Nature Core</h1>

    <div class="artifact-selector" id="selector"></div>

    <div class="balance-grid" id="main-ui" style="display: none;">
        <div class="balance-card">
            <div class="bal-val highlight" id="live-balance">0.0000</div>
            <div class="bal-label" style="font-size: 8px; opacity: 0.5;">ACCUMULATING</div>
        </div>
        <div class="balance-card">
            <div class="bal-val" id="total-balance">0.00</div>
            <div class="bal-label" style="font-size: 8px; opacity: 0.5;">TOTAL CORE</div>
        </div>
    </div>

    <div class="artifact-display">
        <img src="" id="nft-img" class="artifact-image" style="display:none;">
        <div id="loader" style="opacity:0.5;">Connect Wallet...</div>
    </div>

    <div id="badge" class="rarity-badge" style="display:none;"></div>
    <div id="legacy-badge" class="rarity-badge legacy-badge">FOUNDING 50 LEGACY</div>

    <div class="ui-panel">
        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        <div id="ton-connect-button"></div>
    </div>

    <script>
        const COLLECTION_ADDRESS = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let accumulating = 0;
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let currentRate = 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        function harvest() {
            if (accumulating > 0) {
                total += accumulating;
                accumulating = 0;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const name = nft.metadata.name;
            const nftId = parseInt(name.split('#')[1]);

            // Обновляем визуал
            document.getElementById('nft-img').src = nft.metadata.image;
            document.getElementById('badge').innerText = name;
            document.getElementById('badge').style.display = 'block';
            
            // Проверка Legacy
            document.getElementById('legacy-badge').style.display = (nftId <= 50) ? 'block' : 'none';

            // Расчет силы
            let power = 100;
            if (nftId <= 50) power = 150;
            if (name.includes('Rare')) power += 50;
            if (name.includes('Epic')) power += 150;
            if (name.includes('Legendary')) power += 400;

            currentRate = power * 0.1;
            
            // Обновляем активную миниатюру
            document.querySelectorAll('.thumb').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });

            // Перезапуск счетчика
            if (timer) clearInterval(timer);
            const perTick = (currentRate / 86400) / 10;
            timer = setInterval(() => {
                accumulating += perTick;
                document.getElementById('live-balance').innerText = accumulating.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION_ADDRESS}`);
                    const data = await response.json();

                    if (data.nft_items && data.nft_items.length > 0) {
                        allNfts = data.nft_items;
                        document.getElementById('main-ui').style.display = 'grid';
                        document.getElementById('harvest-btn').style.display = 'block';
                        document.getElementById('nft-img').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';

                        // Создаем миниатюры
                        const selector = document.getElementById('selector');
                        selector.innerHTML = '';
                        allNfts.forEach((nft, i) => {
                            const img = document.createElement('img');
                            img.src = nft.metadata.image;
                            img.className = 'thumb';
                            img.onclick = () => selectArtifact(i);
                            selector.appendChild(img);
                        });

                        selectArtifact(0); // По умолчанию выбираем первый
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
</body>
</html>
