<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Game v5.4</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50; --rarity-rare: #0070dd; --rarity-epic: #a335ee; --rarity-leg: #ffb100;
            --dark-bg: #050a05; --glow-color: #4caf50;
            --gold-gradient: linear-gradient(90deg, #ffd700, #fff5b1, #ffb100, #ffd700);
        }
        body { background: var(--dark-bg); color: #e0f2e0; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Фон приложения */
        #app-bg { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: brightness(0.3); transition: 1s; transform: scale(1.05); }
        .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, transparent 20%, var(--dark-bg) 100%); }

        /* Игровой экран */
        .tree-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: -1; overflow: hidden; }
        #tree-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: all 0.8s ease-in-out; }
        .coin-display { position: absolute; top: 15px; right: 20px; color: #ff33cc; font-weight: 900; z-index: 10; font-size: 18px; text-shadow: 0 0 10px rgba(255,51,204,0.5); }

        .view-container { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        .view-container.active { display: flex; }
        section { display: none; flex-direction: column; align-items: center; padding: 15px; width: 100%; height: calc(100vh - 75px); box-sizing: border-box; overflow-y: auto; }
        section.active { display: flex !important; }

        /* Слои артефакта с плавным переходом */
        .artifact-canvas { 
            width: 180px; height: 180px; position: relative; margin: 10px 0; 
            border-radius: 35px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); 
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease; /* Плавность всего холста */
        }
        .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; transition: opacity 0.4s ease; }
        .layer-core { width: 82%; height: 82%; inset: 9%; z-index: 3; animation: core-float 3s infinite ease-in-out; }
        
        @keyframes core-float { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); } 50% { transform: translateY(-8px); filter: drop-shadow(0 0 25px var(--glow-color)); } }

        /* Атрибуты */
        .attr-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0; }
        .attr-item { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 12px; text-align: center; }
        .attr-label { font-size: 8px; opacity: 0.7; text-transform: uppercase; font-weight: bold; }
        .attr-value { font-size: 11px; font-weight: 800; }

        .nav-bar { height: 75px; background: rgba(5, 10, 5, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 11px; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
        .btn-main { background: var(--gold-gradient); background-size: 200% 100%; color: #000; border: none; padding: 15px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        
        #loading-screen { position: fixed; inset: 0; background: url('assets/img/viewwindow.png') center/cover no-repeat; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15vh; transition: opacity 0.8s ease; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h2 style="color: #ff33cc; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff;">Чеканим NFT...</h2>
        <div style="width: 70%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; border: 1px solid var(--glow-color); margin-top: 15px;">
            <div id="progress-bar" style="width: 0%; height: 100%; background: #ff33cc; transition: width 0.2s ease;"></div>
        </div>
        <div id="loading-text" style="margin-top: 10px; font-size: 12px; color: #ff33cc; font-weight: 900;">0%</div>
    </div>

    <div id="app-bg"></div>
    <div class="bg-overlay"></div>
    <div id="portal-overlay" style="position: fixed; inset: 0; background: white; opacity: 0; z-index: 2000; pointer-events: none; transition: 0.8s;"></div>

    <div id="main-menu" class="view-container active">
        <section id="screen-core" class="active">
            <h2 style="letter-spacing: 2px;">Nature Core</h2>
            <div class="artifact-selector" id="nft-list" style="display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 10px 0;"></div>
            
            <div id="canvas-container" class="artifact-canvas" style="display:none;">
                <img src="" id="img-bg" class="layer">
                <img src="" id="img-frame" class="layer">
                <img src="" id="img-core" class="layer layer-core">
            </div>

            <div class="attr-container" id="nft-attrs"></div>
            <button class="btn-main" id="btn-enter-game" style="display:none; background:var(--primary-green);" onclick="enterGame()">Использовать Артефакт</button>
            <footer style="font-size: 9px; opacity: 0.3; margin-top: auto; padding: 10px;">&copy; 2026 Nature Core Project</footer>
        </section>

        <section id="screen-token">
            <h2 style="color: white;">$NCORE</h2>
            <img src="assets/img/Tokken.png" style="width: 120px; border-radius: 50%; border: 2px solid #ff33cc; box-shadow: 0 0 30px #ff33cc;">
            <div style="color: #fff; font-size: 20px; margin-top: 15px;">Баланс: <span id="token-page-balance">0.00</span></div>
            <div style="margin-top: 30px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,51,204,0.2); width: 90%;">
                <h3 style="color: #ff33cc; font-size: 16px; margin-bottom: 10px;">Токеномика</h3>
                <div style="font-size: 13px; line-height: 1.8;">
                    <div style="display:flex; justify-content:space-between"><span>🎮 P2E Награды:</span><b>35%</b></div>
                    <div style="display:flex; justify-content:space-between"><span>💧 Ликвидность:</span><b>20%</b></div>
                    <div style="display:flex; justify-content:space-between"><span>📢 Маркетинг:</span><b>15%</b></div>
                    <div style="display:flex; justify-content:space-between"><span>🏛 Фонд/Команда:</span><b>30%</b></div>
                </div>
            </div>
            <div id="ton-connect-btn" style="margin-top: 20px;"></div>
        </section>

        <section id="screen-quests">
            <h2 style="color: #fff;">Миссии</h2>
            <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,51,204,0.3); border-radius: 12px; padding: 15px; width: 90%;">
                <div style="color: #fff; font-weight: bold;">Подписка на канал</div>
                <div style="color: #ff33cc; font-size: 14px; margin-bottom: 10px;">+10 $NCORE</div>
                <button class="btn-main" style="padding: 10px; width: 100%; font-size: 12px;">Выполнить</button>
            </div>
        </section>

        <nav class="nav-bar">
            <div class="nav-item active" onclick="switchTab('screen-core', this)"><span>🌿</span><span>Склад</span></div>
            <div class="nav-item" onclick="switchTab('screen-token', this)"><span>🪙</span><span>Токен</span></div>
            <div class="nav-item" onclick="switchTab('screen-quests', this)"><span>📜</span><span>Задания</span></div>
        </nav>
    </div>

    <div id="game-view" class="view-container">
        <button onclick="exitGame()" style="position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.6); color: white; border: 1px solid #fff; padding: 5px 12px; border-radius: 8px;">⬅ Меню</button>
        <div class="coin-display" id="coin-balance">0.00 $NCORE</div>
        <div class="tree-container"><img src="assets/tree/stage_1.png" id="tree-img"></div>
        <div style="position: absolute; bottom: 100px; width: 100%; text-align: center;">
            <button id="btn-upgrade-tree" class="btn-main" onclick="upgradeTree()">Улучшить</button>
            <p id="upgrade-info" style="font-size:12px; margin-top: 10px;">Уровень древа: 1 / 9</p>
        </div>
    </div>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        const TREE_CONFIG = { files: ["stage_1.png", "stage_2.png", "stage_3.png", "stage_4.png", "stage_5.png", "stage_6.png", "stage_7.png", "stage_8.png", "stage_9.png"], baseCost: 10, multiplier: 1.6, baseIncome: 0.01 };

        let userNfts = [], selectedArtifact = null, metadataCache = new Map();
        let balance = parseFloat(localStorage.getItem('ncore_balance')) || 0;
        let treeLevel = parseInt(localStorage.getItem('ncore_tree_lvl')) || 1;
        const imageCache = new Map();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json', buttonRootId: 'ton-connect-btn' });

        function switchTab(sId, el) {
            document.querySelectorAll('#main-menu section').forEach(s => s.classList.remove('active'));
            document.getElementById(sId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function preloadImages(urls) {
            urls.forEach(url => { if (!imageCache.has(url)) { const img = new Image(); img.src = url; imageCache.set(url, img); } });
        }

        function formatVal(val) {
            if (!val) return "";
            return val.replace('bg_', '').replace('frame_', '').replace('Y_', '').replace(/_/g, ' ');
        }

        function getRarityColor(text) {
            const t = text.toLowerCase();
            if (t.includes('rare')) return 'var(--rarity-rare)';
            if (t.includes('epic')) return 'var(--rarity-epic)';
            if (t.includes('leg')) return 'var(--rarity-leg)';
            return 'var(--rarity-common)';
        }

        // ОСНОВНАЯ ФУНКЦИЯ ВЫБОРА (ИСПРАВЛЕННАЯ)
        async function buildArtifact(index) {
            if (!userNfts[index]) return;
            const canvas = document.getElementById('canvas-container');
            canvas.style.opacity = "0.3"; // Приглушаем на время смены

            selectedArtifact = userNfts[index];
            const id = selectedArtifact.metadata.name.match(/#(\d+)/)?.[1] || selectedArtifact.index || 0;

            try {
                let meta;
                if (metadataCache.has(id)) { meta = metadataCache.get(id); } 
                else {
                    const res = await fetch(`${PATH_ASSETS}metadata/${id}.json`);
                    meta = await res.json();
                    metadataCache.set(id, meta);
                }

                let coreVal = "Y_basic_1", bgVal = "bg_basic", frameVal = "frame_basic";
                if (meta.attributes) {
                    meta.attributes.forEach(attr => {
                        const type = attr.trait_type.toLowerCase();
                        if (type === 'core') coreVal = attr.value;
                        if (type === 'background') bgVal = attr.value;
                        if (type === 'frame') frameVal = attr.value;
                    });
                }

                const bgPath = `${PATH_ASSETS}backgrounds/${bgVal}.png`;
                const framePath = `${PATH_ASSETS}frames/${frameVal}.png`;
                const corePath = `${PATH_ASSETS}cores/${coreVal}.png`;

                preloadImages([bgPath, framePath, corePath]);

                selectedArtifact.bgPath = bgPath;
                selectedArtifact.framePath = framePath;
                selectedArtifact.corePath = corePath;

                // Применяем картинки
                document.getElementById('app-bg').style.backgroundImage = `url('${bgPath}')`;
                document.getElementById('img-bg').src = bgPath;
                document.getElementById('img-frame').src = framePath;
                document.getElementById('img-core').src = corePath;

                // Обновляем атрибуты
                const attrsList = document.getElementById('nft-attrs');
                attrsList.innerHTML = '';
                meta.attributes.forEach(attr => {
                    const color = getRarityColor(attr.value);
                    const div = document.createElement('div');
                    div.className = 'attr-item';
                    div.style.borderColor = color;
                    div.innerHTML = `<div class="attr-label" style="color:${color}">${attr.trait_type}</div><div class="attr-value" style="color:white">${formatVal(attr.value)}</div>`;
                    attrsList.appendChild(div);
                });

                document.documentElement.style.setProperty('--glow-color', getRarityColor(frameVal));
                canvas.style.display = 'flex';
                document.getElementById('btn-enter-game').style.display = 'block';
                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
                
                setTimeout(() => { canvas.style.opacity = "1"; }, 50); // Возвращаем видимость

            } catch (e) { console.error("Ошибка смены:", e); }
        }

        function enterGame() {
            document.getElementById('portal-overlay').style.opacity = "1";
            setTimeout(() => {
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                refreshGarden();
                document.getElementById('portal-overlay').style.opacity = "0";
            }, 800);
        }

        function exitGame() { document.getElementById('game-view').classList.remove('active'); document.getElementById('main-menu').classList.add('active'); }
        function refreshGarden() { if(!selectedArtifact) return; document.getElementById('tree-img').src = `${PATH_ASSETS}tree/${TREE_CONFIG.files[Math.min(treeLevel - 1, 8)]}`; updateUI(); }

        function updateUI() {
            const cost = Math.floor(TREE_CONFIG.baseCost * Math.pow(TREE_CONFIG.multiplier, treeLevel - 1));
            document.getElementById('coin-balance').innerText = `${balance.toFixed(2)} $NCORE`;
            document.getElementById('token-page-balance').innerText = balance.toFixed(2);
            document.getElementById('upgrade-info').innerText = `Уровень древа: ${treeLevel} / 9`;
            const upBtn = document.getElementById('btn-upgrade-tree');
            if (treeLevel >= 9) { upBtn.innerText = "MAX"; upBtn.disabled = true; } else { upBtn.innerText = `Улучшить за ${cost}`; upBtn.disabled = balance < cost; }
            localStorage.setItem('ncore_balance', balance);
            localStorage.setItem('ncore_tree_lvl', treeLevel);
        }

        function upgradeTree() {
            const cost = Math.floor(TREE_CONFIG.baseCost * Math.pow(TREE_CONFIG.multiplier, treeLevel - 1));
            if(balance >= cost && treeLevel < 9) { balance -= cost; treeLevel++; refreshGarden(); }
        }

        setInterval(() => { if(document.getElementById('game-view').classList.contains('active') && selectedArtifact) { balance += TREE_CONFIG.baseIncome * treeLevel; updateUI(); } }, 1000);

        tonConnectUI.onStatusChange(async (w) => {
            if(w) {
                const res = await fetch(`https://tonapi.io/v2/accounts/${w.account.address}/nfts?collection=${COLLECTION}`);
                const d = await res.json();
                if(d.nft_items) {
                    userNfts = d.nft_items;
                    const list = document.getElementById('nft-list');
                    list.innerHTML = '';
                    userNfts.forEach((n, i) => {
                        const img = document.createElement('img'); img.src = n.metadata.image;
                        img.style.width = '55px'; img.style.borderRadius = '12px'; img.style.cursor='pointer'; img.className = 'thumb';
                        img.onclick = () => buildArtifact(i); list.appendChild(img);
                    });
                    buildArtifact(0);
                }
            }
        });

        // Загрузка
        let prog = 0;
        const loadInt = setInterval(() => {
            prog += 2; document.getElementById('progress-bar').style.width = prog + '%'; document.getElementById('loading-text').innerText = prog + '%';
            if(prog >= 100) { clearInterval(loadInt); setTimeout(() => { document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => document.getElementById('loading-screen').style.display='none', 800); }, 500); }
        }, 50);
    </script>
</body>
</html>
