<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Game v5.2 - Optimized</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50; --rarity-rare: #0070dd; --rarity-epic: #a335ee; --rarity-leg: #ffb100;
            --dark-bg: #050a05; --glow-color: #4caf50;
            --gold-gradient: linear-gradient(90deg, #ffd700, #fff5b1, #ffb100, #ffd700);
        }
        body { background: var(--dark-bg); color: #e0f2e0; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Фон приложения */
        #app-bg { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: brightness(0.3); transition: 1s; transform: scale(1.05); }
        .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, transparent 20%, var(--dark-bg) 100%); }

        /* Контейнер дерева в игре */
        .tree-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: -1; overflow: hidden; }
        #tree-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: all 0.8s ease-in-out; }
        
        /* Элементы интерфейса */
        .view-container { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        .view-container.active { display: flex; }
        section { display: none; flex-direction: column; align-items: center; padding: 15px; width: 100%; height: calc(100vh - 75px); box-sizing: border-box; overflow-y: auto; }
        section.active { display: flex !important; }

        /* Артефакт в центре */
        .artifact-canvas { 
            width: 180px; height: 180px; position: relative; margin: 10px 0; 
            border-radius: 35px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); 
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            transition: transform 1.2s ease-in;
        }
        .canvas-portal { transform: scale(10); filter: brightness(5); }
        .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .layer-core { width: 82%; height: 82%; inset: 9%; z-index: 3; animation: core-float 3s infinite ease-in-out; }
        @keyframes core-float { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); } 50% { transform: translateY(-8px); filter: drop-shadow(0 0 25px var(--glow-color)); } }

        /* Навигация и кнопки */
        .artifact-selector { display: flex; gap: 12px; overflow-x: auto; width: 100%; padding: 10px 0; scrollbar-width: none; }
        .thumb { width: 55px; height: 55px; border-radius: 12px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .thumb.active { opacity: 1; border-color: white; transform: scale(1.1); }
        .btn-main { background: var(--gold-gradient); background-size: 200% 100%; color: #000; border: none; padding: 15px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .nav-bar { height: 75px; background: rgba(5, 10, 5, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }

        /* Загрузка */
        #loading-screen { position: fixed; inset: 0; background: url('assets/img/viewwindow.png') center/cover no-repeat; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15vh; transition: opacity 0.8s ease; }
        .progress-bar { width: 0%; height: 8px; background: #ff33cc; box-shadow: 0 0 15px #ff33cc; }
    </style>
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loading-screen">
        <h2 style="color: #ff33cc; text-shadow: 0 0 5px #fff;">Чеканим NFT...</h2>
        <div style="width: 70%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; border: 1px solid var(--glow-color);">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="loading-text" style="color: #ff33cc; font-weight: 900; margin-top: 5px;">0%</div>
    </div>

    <!-- Профиль -->
    <div id="profile-icon" onclick="toggleProfile()" style="position: fixed; top: 15px; right: 15px; z-index: 1001; font-size: 20px; cursor: pointer; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 50%; border: 1px solid var(--glow-color);">👤</div>
    <div id="profile-menu" style="display: none; position: fixed; top: 65px; right: 15px; width: 220px; background: rgba(5, 10, 5, 0.98); border: 1px solid var(--glow-color); border-radius: 15px; padding: 15px; z-index: 1001; backdrop-filter: blur(10px);">
        <h4 style="margin: 0 0 10px 0; color: var(--primary-green);">Профиль</h4>
        <div id="ton-connect-btn"></div>
        <div id="token-balance" style="font-size: 18px; font-weight: bold; color: #ff33cc; margin-top: 10px;">
            <span id="balance-value">0</span> <span style="font-size: 12px;">$NCORE</span>
        </div>
        <button onclick="toggleProfile()" style="margin-top: 15px; width: 100%; border: 1px solid rgba(255,255,255,0.2); color: white; background: none; border-radius: 8px; padding: 5px;">Закрыть</button>
    </div>

    <div id="app-bg"></div>
    <div class="bg-overlay"></div>
    <div id="portal-overlay" style="position: fixed; inset: 0; background: white; opacity: 0; z-index: 2000; pointer-events: none; transition: 0.8s;"></div>

    <!-- Главное Меню -->
    <div id="main-menu" class="view-container active">
        <section id="screen-core" class="active">
            <h2 style="letter-spacing: 2px;">Nature Core</h2>
            <div class="artifact-selector" id="nft-list"></div>
            
            <!-- Холст артефакта -->
            <div id="canvas-container" class="artifact-canvas" style="display:none;">
                <img src="" id="img-bg" class="layer">
                <img src="" id="img-frame" class="layer">
                <img src="" id="img-core" class="layer layer-core">
            </div>

            <div class="attr-container" id="nft-attrs" style="display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;"></div>
            <button class="btn-main" id="btn-enter-game" style="display:none; background:var(--primary-green); margin-top: 15px;" onclick="enterGame()">Использовать Артефакт</button>
            <footer style="font-size: 9px; opacity: 0.3; margin-top: auto; padding: 10px;">&copy; 2026 Nature Core Project</footer>
        </section>

        <!-- Секция Токена -->
        <section id="screen-token">
            <h2 style="color: white;">$NCORE</h2>
            <img src="assets/img/Tokken.png" style="width: 100px; border-radius: 50%; border: 2px solid #ff33cc; box-shadow: 0 0 20px #ff33cc;">
            <p>Баланс: <span id="token-page-balance" style="color: #ff33cc; font-weight: bold;">0.00</span></p>
        </section>

        <!-- Секция Квестов -->
        <section id="screen-quests">
            <h2 style="color: #fff;">Миссии</h2>
            <div id="quests-list" style="width: 100%;">
                <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span>Подписка на канал</span>
                    <button class="btn-main" style="padding: 5px 10px; font-size: 10px;">+10 $NCORE</button>
                </div>
            </div>
        </section>

        <nav class="nav-bar">
            <div class="nav-item active" onclick="switchTab('screen-core', this)"><span>🌿</span><span>Склад</span></div>
            <div class="nav-item" onclick="switchTab('screen-token', this)"><span>🪙</span><span>Токен</span></div>
            <div class="nav-item" onclick="switchTab('screen-quests', this)"><span>📜</span><span>Задания</span></div>
        </nav>
    </div>

    <!-- Игровой Вид (Сад) -->
    <div id="game-view" class="view-container">
        <div style="position: absolute; top: 15px; left: 15px; z-index: 10;">
            <button onclick="exitGame()" style="background: rgba(0,0,0,0.6); color: white; border: 1px solid #fff; padding: 5px 15px; border-radius: 10px;">⬅ Меню</button>
        </div>
        <div id="coin-balance" style="position: absolute; top: 15px; right: 15px; color: #ff33cc; font-weight: 900; z-index: 10;">0.00 $NCORE</div>
        
        <div class="tree-container">
            <!-- Тут дерево, а фоном станет фон артефакта -->
            <img src="assets/tree/stage_1.png" id="tree-img" alt="Tree">
        </div>

        <div style="position: absolute; bottom: 100px; text-align: center; width: 100%;">
            <button id="btn-upgrade-tree" class="btn-main" onclick="upgradeTree()">Улучшить</button>
            <p id="upgrade-info" style="font-size: 12px; text-shadow: 0 0 5px #000;">Уровень древа: 1</p>
        </div>
    </div>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        const TREE_CONFIG = {
            files: ["stage_1.png", "stage_2.png", "stage_3.png", "stage_4.png", "stage_5.png", "stage_6.png", "stage_7.png", "stage_8.png", "stage_9.png"],
            baseCost: 10, multiplier: 1.6, baseIncome: 0.01
        };

        let userNfts = [], selectedArtifact = null, metadataCache = new Map();
        let balance = parseFloat(localStorage.getItem('ncore_balance')) || 0;
        let treeLevel = parseInt(localStorage.getItem('ncore_tree_lvl')) || 1;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json', buttonRootId: 'ton-connect-btn' });

        function switchTab(sId, el) {
            document.querySelectorAll('#main-menu section').forEach(s => s.classList.remove('active'));
            document.getElementById(sId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        async function buildArtifact(index) {
            if (!userNfts[index]) return;
            selectedArtifact = userNfts[index];
            const artifactName = selectedArtifact.metadata.name;
            const matchId = artifactName.match(/#(\d+)/);
            const id = matchId ? matchId[1] : (selectedArtifact.index || 0);

            try {
                let meta;
                if (metadataCache.has(id)) {
                    meta = metadataCache.get(id);
                } else {
                    const response = await fetch(`${PATH_ASSETS}metadata/${id}.json`);
                    meta = await response.json();
                    metadataCache.set(id, meta);
                }

                let coreVal = "Y_basic_1", bgVal = "bg_basic", frameVal = "frame_basic";
                if (meta.attributes) {
                    meta.attributes.forEach(attr => {
                        const type = attr.trait_type.toLowerCase();
                        if (type === 'core') coreVal = attr.value;
                        if (type === 'background') bgVal = attr.value;
                        if (type === 'frame') frameVal = attr.value;
                    });
                }

                selectedArtifact.bgPath = `${PATH_ASSETS}backgrounds/${bgVal}.png`;
                selectedArtifact.framePath = `${PATH_ASSETS}frames/${frameVal}.png`;
                selectedArtifact.corePath = `${PATH_ASSETS}cores/${coreVal}.png`;

                // ОБНОВЛЯЕМ ФОН ПРИЛОЖЕНИЯ
                document.getElementById('app-bg').style.backgroundImage = `url('${selectedArtifact.bgPath}')`;
                
                document.getElementById('img-bg').src = selectedArtifact.bgPath;
                document.getElementById('img-frame').src = selectedArtifact.framePath;
                document.getElementById('img-core').src = selectedArtifact.corePath;

                const attrsList = document.getElementById('nft-attrs');
                attrsList.innerHTML = '';
                meta.attributes.forEach(attr => {
                    const div = document.createElement('div');
                    div.style.cssText = "background:rgba(255,255,255,0.1); padding:5px; border-radius:5px; font-size:10px;";
                    div.innerHTML = `<b>${attr.trait_type}:</b> ${attr.value}`;
                    attrsList.appendChild(div);
                });

                document.getElementById('canvas-container').style.display = 'flex';
                document.getElementById('btn-enter-game').style.display = 'block';

                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
            } catch (e) { console.error("Ошибка загрузки:", e); }
        }

        function enterGame() {
            const canvas = document.getElementById('canvas-container');
            const overlay = document.getElementById('portal-overlay');
            canvas.classList.add('canvas-portal');
            overlay.style.opacity = "1";
            setTimeout(() => {
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                refreshGarden();
                overlay.style.opacity = "0";
                canvas.classList.remove('canvas-portal');
            }, 1000);
        }

        function exitGame() {
            document.getElementById('game-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
        }

        function refreshGarden() {
            if(!selectedArtifact) return;
            const tree = document.getElementById('tree-img');
            const stageFile = TREE_CONFIG.files[Math.min(treeLevel - 1, 8)];
            tree.src = `${PATH_ASSETS}tree/${stageFile}`;
            
            // ВАЖНО: В режиме игры фон тоже остается фоном артефакта!
            document.getElementById('app-bg').style.backgroundImage = `url('${selectedArtifact.bgPath}')`;
            updateUI();
        }

        function upgradeTree() {
            const cost = Math.floor(TREE_CONFIG.baseCost * Math.pow(TREE_CONFIG.multiplier, treeLevel - 1));
            if(balance >= cost && treeLevel < 9) {
                balance -= cost; treeLevel++;
                refreshGarden();
            }
        }

        function updateUI() {
            const cost = Math.floor(TREE_CONFIG.baseCost * Math.pow(TREE_CONFIG.multiplier, treeLevel - 1));
            document.getElementById('coin-balance').innerText = `${balance.toFixed(2)} $NCORE`;
            document.getElementById('upgrade-info').innerText = `Уровень древа: ${treeLevel} / 9`;
            const upBtn = document.getElementById('btn-upgrade-tree');
            if(treeLevel >= 9) { upBtn.innerText = "MAX"; upBtn.disabled = true; }
            else { upBtn.innerText = `Улучшить за ${cost}`; upBtn.disabled = balance < cost; }
            localStorage.setItem('ncore_balance', balance);
            localStorage.setItem('ncore_tree_lvl', treeLevel);
        }

        setInterval(() => {
            if(document.getElementById('game-view').classList.contains('active') && selectedArtifact) {
                balance += TREE_CONFIG.baseIncome * treeLevel; updateUI();
            }
        }, 1000);

        tonConnectUI.onStatusChange(async (w) => {
            if(w) {
                const res = await fetch(`https://tonapi.io/v2/accounts/${w.account.address}/nfts?collection=${COLLECTION}`);
                const d = await res.json();
                if(d.nft_items) {
                    userNfts = d.nft_items;
                    const list = document.getElementById('nft-list');
                    list.innerHTML = '';
                    userNfts.forEach((n, i) => {
                        const img = document.createElement('img');
                        img.src = n.metadata.image; img.className = 'thumb';
                        img.onclick = () => buildArtifact(i); list.appendChild(img);
                    });
                    buildArtifact(0);
                }
            }
        });

        function toggleProfile() {
            const m = document.getElementById('profile-menu');
            m.style.display = m.style.display === 'none' ? 'block' : 'none';
        }

        // Логика загрузки
        let prog = 0;
        const i = setInterval(() => {
            prog += 5;
            document.getElementById('progress-bar').style.width = prog + '%';
            document.getElementById('loading-text').innerText = prog + '%';
            if(prog >= 100) {
                clearInterval(i);
                setTimeout(() => document.getElementById('loading-screen').style.opacity = '0', 500);
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1300);
            }
        }, 100);
    </script>
</body>
</html>
