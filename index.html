<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Engine v2.4</title>
    <!-- Подключение библиотеки TON Connect -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --dark-bg: #050a05;
            --glow-color: #4caf50;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #112211 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        section { display: none; flex-direction: column; align-items: center; padding: 10px; height: calc(100vh - 70px); box-sizing: border-box; }
        section.active { display: flex; }

        h1 { font-size: 16px; margin: 5px 0; color: var(--primary-green); text-transform: uppercase; letter-spacing: 1px; }

        /* Поле отображения NFT (180px) */
        .artifact-canvas {
            width: 180px; height: 180px;
            position: relative;
            margin: 10px 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
        }

        .layer { position: absolute; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .layer-bg { z-index: 1; }
        .layer-frame { z-index: 2; animation: pulse 4s infinite; }
        .layer-core { z-index: 3; width: 80%; height: 80%; animation: float 3s infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); }
            50% { transform: translateY(-5px); filter: drop-shadow(0 0 20px var(--glow-color)); }
        }

        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

        /* Список NFT */
        .artifact-selector { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 5px 0; scrollbar-width: none; }
        .thumb { width: 50px; height: 50px; border-radius: 8px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.5; }
        .thumb.active { opacity: 1; border-color: white; }

        /* Статистика */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 320px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-val { font-size: 16px; font-weight: bold; color: var(--primary-green); }
        .stat-label { font-size: 7px; opacity: 0.5; text-transform: uppercase; }

        .btn-main {
            background: var(--primary-green); color: black; border: none; padding: 10px 25px;
            border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: auto; margin-bottom: 10px;
        }

        .nav-bar { height: 60px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 9px; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
    </style>
</head>
<body>

    <section id="screen-core" class="active">
        <h1>Nature Core</h1>
        <div class="artifact-selector" id="nft-list"></div>

        <div class="stats-grid" id="ui-stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-val" id="accrual-val">0.0000</div>
                <div class="stat-label">Power</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="total-val">0.00</div>
                <div class="stat-label">Total NCORE</div>
            </div>
        </div>

        <div class="artifact-canvas" id="canvas-container" style="display: none;">
            <!-- Слои артефакта -->
            <img src="" id="img-bg" class="layer layer-bg">
            <img src="" id="img-frame" class="layer layer-frame">
            <img src="" id="img-core" class="layer layer-core">
        </div>

        <div id="status-msg" style="margin: 10px; font-size: 12px; opacity: 0.5;">Подключите TON</div>
        <button class="btn-main" id="harvest-btn" style="display: none;" onclick="harvestEnergy()">Собрать энергию</button>
        <div id="ton-connect-btn"></div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="location.reload()"><span>🌿</span><span>Core</span></div>
        <div class="nav-item"><span>📜</span><span>Quests</span></div>
    </nav>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        
        let userNfts = [];
        let totalBalance = parseFloat(localStorage.getItem('ncore_total')) || 0;
        let sessionAccrual = 0;
        let miningTimer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        document.getElementById('total-val').innerText = totalBalance.toFixed(2);

        /**
         * Сборка артефакта с точным соответствием имен файлов
         */
        async function buildArtifact(index) {
            const nft = userNfts[index];
            if (!nft) return;

            const id = nft.metadata.name.split('#')[1] || (index + 1);
            document.getElementById('status-msg').innerText = `Сборка #${id}...`;

            try {
                const response = await fetch(`${PATH_ASSETS}metadata/${id}.json`);
                if (!response.ok) throw new Error("JSON missing");
                const meta = await response.json();

                let bgFile = "", frameFile = "", coreFile = "";

                meta.attributes.forEach(attr => {
                    const type = attr.trait_type.toLowerCase();
                    // ТЕПЕРЬ ИСПОЛЬЗУЕМ ЗНАЧЕНИЕ КАК ЕСТЬ (с учетом больших букв)
                    const val = attr.value; 

                    if (type === 'background') bgFile = val + ".png";
                    if (type === 'frame') frameFile = val + ".png";
                    if (type === 'core') coreFile = val + ".png";
                });

                // Код ищет файлы точно по именам из JSON
                document.getElementById('img-bg').src = `${PATH_ASSETS}backgrounds/${bgFile}`;
                document.getElementById('img-frame').src = `${PATH_ASSETS}frames/${frameFile}`;
                document.getElementById('img-core').src = `${PATH_ASSETS}cores/${coreFile}`;

                // Настройка цвета свечения
                let rarityColor = "#4caf50";
                if (frameFile.toLowerCase().includes('rare')) rarityColor = "#0070dd";
                else if (frameFile.toLowerCase().includes('epic')) rarityColor = "#a335ee";
                else if (frameFile.toLowerCase().includes('leg')) rarityColor = "#ffb100";

                document.documentElement.style.setProperty('--glow-color', rarityColor);
                document.getElementById('canvas-container').style.display = 'flex';
                document.getElementById('status-msg').style.display = 'none';
                document.getElementById('harvest-btn').style.display = 'block';

                startMining(frameFile, id);
                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            } catch (err) {
                console.error(err);
                document.getElementById('status-msg').innerText = "Ошибка метаданных";
            }
        }

        /**
         * Логика накопления
         */
        function startMining(frameFile, id) {
            if (miningTimer) clearInterval(miningTimer);
            let power = 100;
            if (frameFile.toLowerCase().includes('rare')) power = 250;
            if (parseInt(id) <= 50) power += 150;
            const rate = power * 0.00001;
            miningTimer = setInterval(() => {
                sessionAccrual += rate;
                document.getElementById('accrual-val').innerText = sessionAccrual.toFixed(4);
            }, 1000);
        }

        function harvestEnergy() {
            totalBalance += sessionAccrual;
            sessionAccrual = 0;
            localStorage.setItem('ncore_total', totalBalance);
            document.getElementById('total-val').innerText = totalBalance.toFixed(2);
            document.getElementById('accrual-val').innerText = "0.0000";
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                const data = await response.json();
                if (data.nft_items) {
                    userNfts = data.nft_items;
                    document.getElementById('ui-stats').style.display = 'grid';
                    const list = document.getElementById('nft-list');
                    list.innerHTML = '';
                    userNfts.forEach((nft, i) => {
                        const img = document.createElement('img');
                        img.src = nft.metadata.image;
                        img.className = 'thumb';
                        img.onclick = () => buildArtifact(i);
                        list.appendChild(img);
                    });
                    buildArtifact(0);
                }
            }
        });
    </script>
</body>
</html>
