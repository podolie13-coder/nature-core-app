<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --glow-green: rgba(76, 175, 80, 0.4);
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #0a1a0a 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header { text-align: center; margin-top: 20px; }
        h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary-green); text-shadow: 0 0 15px var(--glow-green); }
        .subtitle { font-size: 14px; opacity: 0.7; }

        .artifact-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .artifact-display {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            background: radial-gradient(circle, var(--glow-green) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.2);
        }

        .artifact-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Скрыта пока не найдена NFT */
        }

        .loader {
            font-size: 12px;
            opacity: 0.5;
            text-align: center;
        }

        .ui-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        #ton-connect-button { display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nature Core</h1>
        <div class="subtitle" id="status-text">Ожидание подключения...</div>
    </div>

    <div class="artifact-container">
        <div class="artifact-display" id="artifact-box">
            <img src="" alt="Artifact" class="artifact-image" id="nft-img">
            <div class="loader" id="loader-text">Место для<br>Артефакта</div>
        </div>
    </div>

    <div class="ui-panel">
        <div id="ton-connect-button"></div>
    </div>

    <script>
        const COLLECTION_ADDRESS = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(async (wallet) => {
            const statusText = document.getElementById('status-text');
            const loaderText = document.getElementById('loader-text');
            const nftImg = document.getElementById('nft-img');

            if (wallet) {
                statusText.innerText = 'Сканирование кошелька...';
                const address = wallet.account.address;
                
                try {
                    // Используем публичный API TON для поиска NFT
                    const response = await fetch(`https://tonapi.io/v2/accounts/${address}/nfts?collection=${COLLECTION_ADDRESS}`);
                    const data = await response.json();

                    if (data.nft_items && data.nft_items.length > 0) {
                        const nft = data.nft_items[0]; // Берем первый найденный артефакт
                        const imageUrl = nft.metadata.image;
                        
                        // Показываем картинку
                        nftImg.src = imageUrl;
                        nftImg.style.display = 'block';
                        loaderText.style.display = 'none';
                        statusText.innerText = `Артефакт: ${nft.metadata.name}`;
                        statusText.style.color = '#4caf50';
                    } else {
                        statusText.innerText = 'Артефакты не найдены';
                        statusText.style.color = '#ff5252';
                        loaderText.innerText = 'У вас нет NFT\nэтой коллекции';
                    }
                } catch (e) {
                    console.error(e);
                    statusText.innerText = 'Ошибка связи с блокчейном';
                }
            } else {
                statusText.innerText = 'Подключите кошелек для доступа';
                nftImg.style.display = 'none';
                loaderText.style.display = 'block';
                loaderText.innerText = 'Место для\nАртефакта';
            }
        });
    </script>
</body>
</html>
