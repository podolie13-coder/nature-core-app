<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50;
            --rarity-rare: #0070dd;
            --rarity-epic: #a335ee;
            --rarity-legendary: #ffb100;
            --glow-color: rgba(76, 175, 80, 0.4);
            --dark-bg: #050a05;
        }

        body {
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #112211 0%, #050a05 100%);
            color: #e0f2e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        section {
            display: none; flex-direction: column; align-items: center;
            padding: 15px; height: calc(100vh - 70px); box-sizing: border-box;
        }
        section.active { display: flex; }

        .header { text-align: center; width: 100%; margin-bottom: 5px; }
        h1 { font-size: 18px; margin: 0; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; }

        /* Конструктор слоев */
        .artifact-container {
            width: 220px; height: 220px;
            position: relative;
            margin: 20px 0;
            display: flex; align-items: center; justify-content: center;
        }

        .layer {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: contain;
            transition: all 0.5s ease;
        }

        /* Анимация парения для ядра */
        .layer-core {
            z-index: 3;
            animation: float 4s infinite ease-in-out;
        }

        /* Анимация пульсации для рамки */
        .layer-frame {
            z-index: 2;
            animation: pulse-frame 6s infinite ease-in-out;
        }

        .layer-bg { z-index: 1; opacity: 0.6; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes pulse-frame {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Остальные стили */
        .artifact-selector { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 10px 5px; }
        .thumb { width: 50px; height: 50px; border-radius: 10px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.5; }
        .thumb.active { opacity: 1; border-color: #fff !important; }
        
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; }
        .balance-card { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; text-align: center; }
        
        .rarity-label { font-size: 12px; font-weight: 900; padding: 4px 12px; border-radius: 20px; border: 1px solid; margin-bottom: 10px; }
        
        .btn-harvest { background: var(--primary-green); color: #000; border: none; padding: 12px; border-radius: 15px; font-weight: 900; width: 100%; max-width: 280px; margin-top: auto; margin-bottom: 10px; }
        
        .nav-bar { height: 70px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.4; font-size: 10px; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
    </style>
</head>
<body>

    <section id="main-screen" class="active">
        <div class="header"><h1>Nature Core</h1></div>
        
        <div class="artifact-selector" id="selector"></div>

        <div class="balance-grid" id="main-ui" style="display: none;">
            <div class="balance-card">
                <div class="bal-val" id="live-balance" style="color:var(--primary-green);">0.0000</div>
                <div style="font-size: 8px; opacity: 0.5;">ACCUMULATING</div>
            </div>
            <div class="balance-card">
                <div class="bal-val" id="total-balance">0.00</div>
                <div style="font-size: 8px; opacity: 0.5;">TOTAL CORE</div>
            </div>
        </div>

        <div class="artifact-container" id="artifact-engine" style="display: none;">
            <img src="" id="layer-bg" class="layer layer-bg">
            <img src="" id="layer-frame" class="layer layer-frame">
            <img src="" id="layer-core" class="layer layer-core">
        </div>
        <div id="loader">Connect Wallet...</div>

        <div id="rarity-badge" class="rarity-label" style="display:none;"></div>

        <button class="btn-harvest" id="harvest-btn" onclick="harvest()" style="display:none;">Harvest Energy</button>
        <div id="ton-connect-button"></div>
    </section>

    <section id="tasks-screen">
        <div class="header"><h1>Quests</h1></div>
        <div style="padding: 20px; text-align: center; opacity: 0.5;">Задания скоро появятся...</div>
    </section>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showScene('main-screen', this)"><span>🌿</span><span>Core</span></div>
        <div class="nav-item" onclick="showScene('tasks-screen', this)"><span>📜</span><span>Tasks</span></div>
    </nav>

    <script>
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let allNfts = [];
        let total = parseFloat(localStorage.getItem('ncore_v1_total')) || 0;
        let timer = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        document.getElementById('total-balance').innerText = total.toFixed(2);

        function showScene(sceneId, navElement) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(sceneId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navElement.classList.add('active');
        }

        function getRarityInfo(attributes) {
            let info = { name: 'Common', color: '#4caf50', bonus: 100, class: 'border-common', file: 'common' };
            attributes.forEach(attr => {
                const val = attr.value.toLowerCase();
                if (val.includes('rare')) info = { name: 'Rare', color: '#0070dd', bonus: 200, class: 'border-rare', file: 'rare' };
                if (val.includes('epic')) info = { name: 'Epic', color: '#a335ee', bonus: 400, class: 'border-epic', file: 'epic' };
                if (val.includes('legendary')) info = { name: 'Legendary', color: '#ffb100', bonus: 900, class: 'border-legendary', file: 'legendary' };
            });
            return info;
        }

        function selectArtifact(index) {
            const nft = allNfts[index];
            const attributes = nft.metadata.attributes || [];
            const rarity = getRarityInfo(attributes);
            
            // Собираем слои
            // ВАЖНО: замени пути на свои, когда загрузишь файлы
            document.getElementById('layer-frame').src = `assets/frames/${rarity.file}.png`;
            
            // Пример поиска ядра в атрибутах
            let coreType = 'default';
            attributes.forEach(a => {
                if(a.trait_type === 'Core' || a.trait_type === 'Cores') coreType = a.value.toLowerCase();
            });
            document.getElementById('layer-core').src = `assets/cores/${coreType}.png`;
            document.getElementById('layer-bg').src = `assets/bg/main_bg.png`;

            document.getElementById('artifact-engine').style.display = 'flex';

            // Бейдж
            const badge = document.getElementById('rarity-badge');
            badge.innerText = `${rarity.name} #${nft.metadata.name.split('#')[1]}`;
            badge.style.color = rarity.color;
            badge.style.borderColor = rarity.color;
            badge.style.display = 'block';

            // Расчет
            let currentRate = rarity.bonus * 0.1;
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));

            if (timer) clearInterval(timer);
            let accumulating = 0;
            timer = setInterval(() => {
                accumulating += (currentRate / 86400) / 10;
                document.getElementById('live-balance').innerText = accumulating.toFixed(4);
            }, 100);
        }

        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                try {
                    const response = await fetch(`https://tonapi.io/v2/accounts/${wallet.account.address}/nfts?collection=${COLLECTION}`);
                    const data = await response.json();
                    if (data.nft_items) {
                        allNfts = data.nft_items;
                        document.getElementById('main-ui').style.display = 'grid';
                        document.getElementById('harvest-btn').style.display = 'block';
                        document.getElementById('loader').style.display = 'none';
                        
                        const selector = document.getElementById('selector');
                        selector.innerHTML = '';
                        allNfts.forEach((nft, i) => {
                            const img = document.createElement('img');
                            img.src = nft.metadata.image; // Для превью используем общую картинку
                            img.className = `thumb`;
                            img.onclick = () => selectArtifact(i);
                            selector.appendChild(img);
                        });
                        selectArtifact(0);
                    }
                } catch (e) { console.error(e); }
            }
        });

        function harvest() {
            let val = parseFloat(document.getElementById('live-balance').innerText);
            if (val > 0) {
                total += val;
                localStorage.setItem('ncore_v1_total', total);
                document.getElementById('total-balance').innerText = total.toFixed(2);
                document.getElementById('live-balance').innerText = "0.0000";
            }
        }
    </script>
</body>
</html>
