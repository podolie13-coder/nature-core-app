<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nature Core Game v5.2</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --primary-green: #4caf50;
            --rarity-common: #4caf50; --rarity-rare: #0070dd; --rarity-epic: #a335ee; --rarity-leg: #ffb100;
            --dark-bg: #050a05; --glow-color: #4caf50;
            --gold-gradient: linear-gradient(90deg, #ffd700, #fff5b1, #ffb100, #ffd700);
        }
        body { background: var(--dark-bg); color: #e0f2e0; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Фон */
        #app-bg { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: brightness(0.3); transition: 1s; transform: scale(1.05); }
        .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, transparent 20%, var(--dark-bg) 100%); }

        /* Портал */
        #portal-overlay { position: fixed; inset: 0; background: white; opacity: 0; z-index: 2000; pointer-events: none; transition: opacity 0.8s ease-in-out; }

        .view-container { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        .view-container.active { display: flex; }

        section { display: none; flex-direction: column; align-items: center; padding: 15px; width: 100%; height: calc(100vh - 75px); box-sizing: border-box; overflow-y: auto; }
        section.active { display: flex !important; }

        /* Холст артефакта */
        .artifact-canvas { 
            width: 180px; height: 180px; position: relative; margin: 10px 0; 
            border-radius: 35px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); 
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            transition: transform 1.2s ease-in;
        }
        .canvas-portal { transform: scale(10); filter: brightness(5); }

        .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .layer-bg { z-index: 1; }
        .layer-frame { z-index: 2; }
        .layer-core { width: 82%; height: 82%; inset: 9%; z-index: 3; animation: core-float 3s infinite ease-in-out; }
        
        @keyframes core-float { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px var(--glow-color)); } 50% { transform: translateY(-8px); filter: drop-shadow(0 0 25px var(--glow-color)); } }

        /* Селектор NFT */
        .artifact-selector { display: flex; gap: 12px; overflow-x: auto; width: 100%; padding: 10px 0; scrollbar-width: none; }
        .artifact-selector::-webkit-scrollbar { display: none; }
        .thumb { width: 55px; height: 55px; border-radius: 12px; flex-shrink: 0; border: 2px solid transparent; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .thumb.active { opacity: 1; border-color: white; transform: scale(1.1); }

        /* Атрибуты */
        .attr-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0; }
        .attr-item { background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 12px; text-align: center; min-width: 85px; }
        .attr-label { font-size: 7px; opacity: 0.5; text-transform: uppercase; }
        .attr-value { font-size: 10px; font-weight: 800; }

        /* Игровое поле */
        .game-scene { position: relative; width: 100%; height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; margin: 20px 0; }
        
        /* Мини-артефакт в Саду (Многослойный) */
        .mini-artifact { 
            width: 80px; height: 80px; border-radius: 20px; 
            background: rgba(0,0,0,0.6); border: 2px solid var(--glow-color); 
            box-shadow: 0 0 20px var(--glow-color); z-index: 10; 
            overflow: hidden; position: relative;
        }
        .mini-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .mini-core { width: 80%; height: 80%; inset: 10%; z-index: 3; }

        .energy-beam { position: absolute; top: 85px; width: 4px; background: linear-gradient(to bottom, var(--glow-color), var(--primary-green)); box-shadow: 0 0 15px var(--glow-color); z-index: 5; animation: beam-flicker 0.2s infinite alternate; }
        @keyframes beam-flicker { from { opacity: 0.5; } to { opacity: 1; } }
        .tree-unit { font-size: 100px; filter: drop-shadow(0 0 20px var(--primary-green)); z-index: 10; }

        .btn-main { background: var(--gold-gradient); background-size: 200% 100%; color: #000; border: none; padding: 15px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .nav-bar { height: 75px; background: rgba(5, 10, 5, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 11px; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--primary-green); }
        footer { font-size: 9px; opacity: 0.3; text-align: center; padding: 10px; width: 90%; margin-top: auto; }
        /* Загрузочный экран */
        #loading-screen { position: fixed; inset: 0; background: var(--dark-bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(76, 175, 80, 0.2); border-top-color: var(--primary-green); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="color: var(--primary-green); letter-spacing: 2px; margin: 0;">Загрузка Природы...</h2>
    </div>
    <!-- НОВЫЙ БЛОК ПРОФИЛЯ НАЧАЛО -->
    <div id="profile-icon" onclick="toggleProfile()" style="position: fixed; top: 15px; right: 15px; z-index: 1001; font-size: 20px; cursor: pointer; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 50%; border: 1px solid var(--glow-color);">
        👤
    </div>

    <div id="profile-menu" style="display: none; position: fixed; top: 65px; right: 15px; width: 220px; background: rgba(5, 10, 5, 0.98); border: 1px solid var(--glow-color); border-radius: 15px; padding: 15px; z-index: 1001; box-shadow: 0 0 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
        <h4 style="margin: 0 0 10px 0; color: var(--primary-green);">Профиль</h4>
        
        <!-- Вот сюда автоматически отрисуется кнопка кошелька -->
        <div id="ton-connect-btn"></div>
        
        <button onclick="toggleProfile()" style="margin-top: 15px; width: 100%; background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px; border-radius: 8px; cursor: pointer; font-size: 12px;">Закрыть</button>
    </div>
    <!-- НОВЫЙ БЛОК ПРОФИЛЯ КОНЕЦ -->

    <div id="app-bg"></div>
    <div id="app-bg"></div>
    <div class="bg-overlay"></div>
    <div id="portal-overlay"></div>

    <div id="main-menu" class="view-container active">
        <section id="screen-core" class="active">
            <h2 style="letter-spacing: 2px;">Nature Core</h2>
            <div class="artifact-selector" id="nft-list"></div>
            <div id="canvas-container" class="artifact-canvas" style="display:none;">
                <img src="" id="img-bg" class="layer layer-bg">
                <img src="" id="img-frame" class="layer layer-frame">
                <img src="" id="img-core" class="layer layer-core">
            </div>
            <div class="attr-container" id="nft-attrs"></div>
            <button class="btn-main" id="btn-enter-game" style="display:none; background:var(--primary-green);" onclick="enterGame()">Использовать Артефакт</button>
            <footer>&copy; 2026 Nature Core Project. All intellectual property belongs to the creator.</footer>
        </section>

        <!-- Остальные секции (Token, Quests) -->
        <section id="screen-token">
            <h2>Токен $NCORE</h2>
            <div style="font-size: 50px; margin: 30px;">🪙</div>
            <p id="total-earned">Баланс: 0.00</p>
        </section>
        <section id="screen-quests"><h2>Задания</h2><p style="opacity: 0.5;">Скоро...</p></section>

        <nav class="nav-bar">
            <div class="nav-item active" onclick="switchTab('screen-core', this)"><span>🌿</span><span>Склад</span></div>
            <div class="nav-item" onclick="switchTab('screen-token', this)"><span>🪙</span><span>Токен</span></div>
            <div class="nav-item" onclick="switchTab('screen-quests', this)"><span>📜</span><span>Задания</span></div>
        </nav>
    </div>

    <div id="game-view" class="view-container">
        <button onclick="exitGame()" style="position:absolute; top:20px; left:20px; z-index:100; background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:10px;">⬅ Меню</button>
        <div style="font-size: 24px; font-weight: 900; text-align: center; margin-top:20px;" id="coin-balance">0.00 $NCORE</div>
        
        <div class="game-scene">
            <!-- МНОГОСЛОЙНЫЙ МИНИ-АРТЕФАКТ -->
            <div id="garden-mini-art" class="mini-artifact">
                <img src="" id="mini-bg-img" class="mini-layer" style="z-index:1;">
                <img src="" id="mini-frame-img" class="mini-layer" style="z-index:2;">
                <img src="" id="mini-core-img" class="mini-layer mini-core" style="z-index:3;">
            </div>
            <div id="beam" class="energy-beam" style="height:0;"></div>
            <div id="tree-unit" class="tree-unit">🌱</div>
        </div>

        <button id="btn-upgrade-tree" class="btn-main" onclick="upgradeTree()" disabled>Улучшить за 10 $NCORE</button>
        <p id="upgrade-info" style="font-size:12px; margin-top: 10px;">Уровень древа: 1</p>
    </div>

    <script>
        const PATH_ASSETS = 'assets/';
        const COLLECTION = 'EQB0QglMfw9kYBGaT2irSjaQPRlrtkKfwfgoKBQBrFK_Mv02';
        let userNfts = [], selectedArtifact = null, metadataCache = new Map();
        let balance = parseFloat(localStorage.getItem('ncore_balance')) || 0;
        let treeLevel = parseInt(localStorage.getItem('ncore_tree_lvl')) || 1;
        const treeStages = ["🌱", "🌿", "🌳", "🌳✨"];
        const CORE_NAMES = { "Common 1": "Wood Core", "Common 2": "Stone Core", "Common 3": "Metal Core", "Rare 1": "Frost Core", "Rare 2": "Storm Core", "Rare 3": "Ember Core", "Rare 4": "Terra Core", "Epic 1": "Void Core", "Epic 2": "Plasma Core", "Epic 3": "Solar Core", "Legendary 1": "Nature Core", "Legendary 2": "Ancient Core", "Legendary 3": "Eternal Core" };

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://podolie13-coder.github.io/nature-core-app/tonconnect-manifest.json', buttonRootId: 'ton-connect-btn' });

        function switchTab(sId, el) {
            document.querySelectorAll('#main-menu section').forEach(s => s.classList.remove('active'));
            document.getElementById(sId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function enterGame() {
            const canvas = document.getElementById('canvas-container');
            const overlay = document.getElementById('portal-overlay');
            canvas.classList.add('canvas-portal');
            overlay.style.opacity = "1";
            overlay.style.pointerEvents = "all";
            setTimeout(() => {
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                refreshGarden();
                setTimeout(() => {
                    overlay.style.opacity = "0"; overlay.style.pointerEvents = "none";
                    canvas.classList.remove('canvas-portal');
                }, 100);
            }, 1200);
        }

        function exitGame() {
            document.getElementById('game-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
        }

        function formatVal(val) {
            if (!val) return "";
            if (val.startsWith('bg_')) return val.replace('bg_', '').replace(/_/g, ' ');
            if (val.startsWith('Y_')) {
                const p = val.split('_'), r = p[1].charAt(0).toUpperCase() + p[1].slice(1);
                return CORE_NAMES[`${r} ${p[2]}`] || `${r} ${p[2]} Type`;
            }
            if (val.startsWith('frame_')) {
                const p = val.split('_'), r = p[1].charAt(0).toUpperCase() + p[1].slice(1);
                return `${r} ${p[2]} Frame`;
            }
            return val;
        }

        function getRarityColor(text) {
            const t = text.toLowerCase();
            if (t.includes('rare')) return 'var(--rarity-rare)';
            if (t.includes('epic')) return 'var(--rarity-epic)';
            if (t.includes('leg')) return 'var(--rarity-leg)';
            return 'var(--rarity-common)';
        }

        async function buildArtifact(index) {
            selectedArtifact = userNfts[index];
            const id = selectedArtifact.metadata.name.match(/#(\d+)/)[1];
            try {
                let meta;
                if(metadataCache.has(id)) meta = metadataCache.get(id);
                else { const res = await fetch(`${PATH_ASSETS}metadata/${id}.json`); meta = await res.json(); metadataCache.set(id, meta); }
                
                document.getElementById('nft-attrs').innerHTML = '';
                let coreF = "", bgF = "", frameF = "";
                meta.attributes.forEach(a => {
                    const color = getRarityColor(a.value), div = document.createElement('div');
                    div.className = 'attr-item'; div.style.borderColor = color;
                    div.innerHTML = `<div class="attr-label">${a.trait_type}</div><div class="attr-value" style="color:${color}">${formatVal(a.value)}</div>`;
                    document.getElementById('nft-attrs').appendChild(div);
                    const t = a.trait_type.toLowerCase();
                    if(t === 'core') coreF = a.value + ".png";
                    if(t === 'background') bgF = a.value + ".png";
                    if(t === 'frame') frameF = a.value + ".png";
                });
                
                // СОХРАНЯЕМ ПУТИ К СЛОЯМ
                selectedArtifact.corePath = `${PATH_ASSETS}cores/${coreF}`;
                selectedArtifact.bgPath = `${PATH_ASSETS}backgrounds/${bgF}`;
                selectedArtifact.framePath = `${PATH_ASSETS}frames/${frameF}`;

                document.getElementById('img-core').src = selectedArtifact.corePath;
                document.getElementById('img-bg').src = selectedArtifact.bgPath;
                document.getElementById('img-frame').src = selectedArtifact.framePath;
                
                document.getElementById('app-bg').style.backgroundImage = `url('${selectedArtifact.bgPath}')`;
                document.documentElement.style.setProperty('--glow-color', getRarityColor(frameF));
                
                document.getElementById('canvas-container').style.display = 'flex';
                document.getElementById('btn-enter-game').style.display = 'block';
                document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
            } catch(e) {}
        }

        function refreshGarden() {
            if(!selectedArtifact) return;
            // ОБНОВЛЯЕМ ВСЕ СЛОИ В САДУ
            document.getElementById('mini-bg-img').src = selectedArtifact.bgPath;
            document.getElementById('mini-frame-img').src = selectedArtifact.framePath;
            document.getElementById('mini-core-img').src = selectedArtifact.corePath;
            
            document.getElementById('beam').style.height = "160px";
            document.getElementById('tree-unit').innerText = treeStages[Math.min(treeLevel-1, 3)];
            updateUI();
        }

        setInterval(() => {
            if(document.getElementById('game-view').classList.contains('active') && selectedArtifact) {
                balance += 0.01 * treeLevel; updateUI();
            }
        }, 1000);

        function updateUI() { 
            document.getElementById('coin-balance').innerText = `${balance.toFixed(2)} $NCORE`;
            document.getElementById('upgrade-info').innerText = `Уровень древа: ${treeLevel}`;
            document.getElementById('btn-upgrade-tree').disabled = !(balance >= 10 && treeLevel < 4);
            localStorage.setItem('ncore_balance', balance); localStorage.setItem('ncore_tree_lvl', treeLevel);
        }

        function upgradeTree() {
            if(balance >= 10) { balance -= 10; treeLevel++; updateUI(); refreshGarden(); }
        }

        tonConnectUI.onStatusChange(async (w) => { if(w) { 
            const res = await fetch(`https://tonapi.io/v2/accounts/${w.account.address}/nfts?collection=${COLLECTION}`);
            const d = await res.json();
            if(d.nft_items) {
                userNfts = d.nft_items;
                document.getElementById('nft-list').innerHTML = '';
                userNfts.forEach((n, i) => {
                    const img = document.createElement('img'); img.src = n.metadata.image; img.className = 'thumb';
                    img.onclick = () => buildArtifact(i); document.getElementById('nft-list').appendChild(img);
                });
                buildArtifact(0);
            }
        }});
        // Логика управления окном профиля
        function toggleProfile() {
            const menu = document.getElementById('profile-menu');
            const isHidden = menu.style.display === 'none';
            menu.style.display = isHidden ? 'block' : 'none';
        }

        // Закрытие меню при клике в любое другое место экрана
        window.addEventListener('click', (e) => {
            const menu = document.getElementById('profile-menu');
            const icon = document.getElementById('profile-icon');
            if (menu && icon && !menu.contains(e.target) && !icon.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
        // Скрытие загрузочного экрана после полной загрузки страницы
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800);
                }
            }, 500);
        });
    </script>
</body>
</html>
